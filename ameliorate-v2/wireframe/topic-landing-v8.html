<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic landing v8 — build-a-wall</title>
<!--
  Clickable wireframe for the "topic selected" state (nothing else selected). v8.
  Generated from ameliorate-v2/UX-design.md + ontology.md ("Build a wall" example),
  viewed as danny (no own scores; sees alice/bob/casey aggregated).
  Depends on versions.js and prototype-bar.js for the prototype bar, and on
  vendor/dagre.min.js + vendor/svg-pan-zoom.min.js for the diagram; everything
  else is inline. Clickable, not functional.

  Context + the version switcher live in the prototype bar at the very top
  (the "i" button, and "version N" next to it) - that bar is scaffolding, not design.

  v8 changes are listed in the "i" popover ("What's new" tab). Headlines:
    - dagre lays the structure diagram out, so edges route around boxes instead
      of through them and labels get reserved space
    - the diagram pans by dragging and zooms by wheel, with zoom / fit buttons
    - the claim popup is chrome now: it holds its size as the diagram scales
-->
<script src="versions.js"></script>
<!-- Layout + pan/zoom for the structure diagram. Plain <script src> like the prototype bar's
     files, so the wireframe still opens over file://; see ai-designs/dagre-layout-and-pan-zoom.md -->
<script src="vendor/dagre.min.js"></script>
<script src="vendor/svg-pan-zoom.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e2e4e8;
    --line-strong: #cfd2d8;
    --text: #23262b;
    --muted: #6b7079;
    --accent: #3b5bdb;
    --purple: #6a3d9a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.4;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 900px;
  }

  /* ---- Top bar ---- */
  .topbar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .topbar .hamburger {
    font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted);
    background: none; border: none; padding: 4px 6px; border-radius: 6px;
  }
  .topbar .hamburger:hover { background: var(--bg); }
  .topbar .crumb { font-weight: 600; }
  .topbar .crumb .owner { color: var(--muted); font-weight: 500; }
  .topbar .spacer { flex: 1; }
  .persp-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 4px 10px; color: var(--muted); cursor: pointer; background: var(--bg);
    font-size: 12.5px;
  }
  .persp-chip:hover { border-color: var(--accent); color: var(--text); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #dfe3ea; color: #444; display: flex; align-items: center; justify-content: center;
    font-weight: 600; cursor: pointer;
  }

  /* ---- Prototype scaffolding: version switcher + info popover ----
     Housed in prototype-bar.js - see that file's own header. */

  /* ---- Panes (drag-resizable split) ---- */
  .panes { flex: 1 1 auto; display: flex; min-height: 0; }
  .agenda {
    flex: 0 0 auto; width: 46%; min-width: 280px;
    background: var(--panel); overflow-y: auto; padding: 18px 18px 40px;
  }
  .divider {
    flex: 0 0 6px; position: relative; cursor: col-resize;
    background: var(--line); z-index: 9;
  }
  .divider::before { content: ""; position: absolute; inset: 0 -5px; } /* wider hit area */
  .divider:hover, .divider.dragging { background: var(--accent); }
  .structure {
    position: relative;
    flex: 1 1 0; min-width: 360px; display: flex; flex-direction: column; background: var(--bg);
  }

  /* ---- Agenda sections ---- */
  .section { padding: 6px 0 14px; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: none; }
  .section h2 {
    font-size: 15px; margin: 6px 0 10px; letter-spacing: .2px;
  }
  .desc { color: #3d4149; margin: 4px 0 2px; }

  /* Pills (nodes / edges / references) */
  .pill {
    display: inline-flex; align-items: center; text-align: left;
    border-radius: 10px; padding: 3px 9px; cursor: pointer;
    font-size: 12.5px; line-height: 1.25; vertical-align: middle;
    border: 2px solid transparent; background: #fff;
    max-width: 100%;
  }
  .pill.inline { font-size: inherit; padding: 1px 7px; border-radius: 8px; margin: 0 1px; }
  .pill:hover { filter: brightness(0.97); box-shadow: 0 0 0 2px rgba(59,91,219,.15); }
  .pill .tag { font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-left: 6px; }

  /* Explore questions */
  .q-list { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .q-item {
    display: flex; align-items: flex-start; gap: 8px;
    cursor: pointer; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent;
  }
  .q-item:hover { background: var(--bg); }
  .q-item.selected { background: #eef1fc; border-color: #c7d0f5; }
  .q-dot {
    flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; margin-top: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset;
  }
  .q-text { flex: 1; min-width: 0; }

  /* Highlights */
  .filter-row { display: flex; gap: 8px; margin: 4px 0 8px; flex-wrap: wrap; }
  .filter-pill {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 11px;
    cursor: pointer; font-size: 12.5px; background: var(--panel); color: var(--muted);
    user-select: none;
  }
  .filter-pill:hover { border-color: var(--accent); }
  .filter-pill.active { background: #23262b; color: #fff; border-color: #23262b; }
  .filter-pill .ic { font-size: 12px; }

  .hot-list { display: flex; flex-direction: column; gap: 2px; }
  /* padding/radius/hover match .q-item, so Highlights reads at the same density as Explore questions */
  .hot-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 8px; }
  .hot-row:hover { background: var(--bg); }
  /* fixed-width icon column so every row's body starts at the same x; icons centred so a
     single icon lines up with the centre of a double-icon stack */
  .hot-row .categories { flex: 0 0 40px; display: inline-flex; justify-content: center; gap: 1px; padding-top: 2px; }
  .hot-row .categories span { width: 18px; text-align: center; font-size: 12px; line-height: 1.25; display: inline-block; }
  .hot-body { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .relation-word { color: var(--muted); font-size: 12px; }

  .show-more {
    margin-top: 10px; background: none; border: none; color: var(--accent);
    cursor: pointer; font-size: 12.5px; padding: 2px 0;
  }
  .show-more:hover { text-decoration: underline; }

  /* ---- Structure pane ---- */
  .struct-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .struct-head h2 { font-size: 15px; margin: 0; }

  /* Summary strip — the tab row stays visible when collapsed, so there's always
     something to click to bring the body back */
  .summary { border-bottom: 1px solid var(--line); background: var(--panel); }
  /* the whole row collapses the summary, so it hovers and takes a pointer like the Color key's title */
  .summary-tabs { display: flex; align-items: center; gap: 2px; padding: 0 12px; cursor: pointer; }
  /* --line rather than the --bg the agenda rows hover to: this strip is full-width with no
     unhovered sibling beside it to compare against, and --bg's 4% step goes unnoticed there */
  .summary-tabs:hover { background: var(--line); }
  /* the row is the control, so the chevron is only its state indicator - no button chrome, and it
     brightens with the row rather than hovering on its own */
  .summary-collapse {
    border: none; background: none; padding: 0 4px; margin-left: 6px;
    color: var(--muted); font-size: 11px; line-height: 1; cursor: pointer;
  }
  .summary-tabs:hover .summary-collapse { color: var(--text); }
  .summary-tab {
    border: none; background: none; cursor: pointer; font: inherit; font-size: 12.5px;
    color: var(--muted); padding: 9px 8px 8px; border-radius: 7px 7px 0 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  /* a step darker than the row's own hover, which is always under it when a tab is hovered */
  .summary-tab:hover { color: var(--text); background: var(--line-strong); }
  .summary-tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  /* collapsed hides the body, so the active tab reads as unselected too - nothing is "showing" */
  .summary.collapsed .summary-tab.active { color: var(--muted); font-weight: normal; border-bottom-color: transparent; }
  .summary-body { padding: 8px 16px 14px; }
  .summary.collapsed .summary-body { display: none; }
  /* inline-block refs (own compact line-height, matching the agenda's inline pills) so
     wrapped pill lines get row spacing from the paragraph without inflating pill height */
  .summary-body p { margin: 0; color: #3d4149; line-height: 1.85; }
  .summary-body .ref {
    display: inline-block; border-radius: 8px; padding: 1px 7px; margin: 0 1px;
    font-size: inherit; line-height: 1.25; vertical-align: middle;
    cursor: pointer; border: 2px solid transparent; white-space: nowrap;
  }
  .summary-body .ref:hover { box-shadow: 0 0 0 2px rgba(59,91,219,.15); }
  .sunburst-wrap { display: flex; align-items: center; gap: 16px; }
  .sunburst-wrap figcaption { color: var(--muted); font-size: 12px; }

  /* Diagram — dagre lays out a fixed pixel canvas, svg-pan-zoom moves it under a fixed pane.
     Nodes and edge labels stay HTML inside foreignObject so pillStyle's gradient border, which
     is a padding-box/border-box background trick, keeps working. */
  .struct-body { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .diagram-box { position: absolute; inset: 0; overflow: hidden; }
  .diagram {
    display: block; width: 100%; height: 100%;
    touch-action: none; user-select: none; cursor: grab;
  }
  .diagram.panning { cursor: grabbing; }
  .diagram path.edge { stroke: #9aa0aa; stroke-width: 1.6; fill: none; transition: opacity .18s, stroke .18s; }
  .diagram path.edge.hl { stroke: var(--accent); stroke-width: 2.6; }
  /* Chrome clips a foreignObject to its box, so each one is NODE_PAD bigger than the element on
     every side and the element wears that as margin - otherwise the focus ring, which is an
     outer box-shadow, gets cut off. Hits belong to the element, not to the padding around it. */
  .diagram foreignObject { pointer-events: none; }
  .diag-node {
    margin: 8px; width: 160px; text-align: center; font-size: 11.5px; line-height: 1.2;
    border-radius: 12px; padding: 6px 9px; border: 3px solid transparent; background: #fff;
    cursor: pointer; pointer-events: auto; box-shadow: 0 1px 2px rgba(0,0,0,.05);
    transition: opacity .18s, filter .18s;
  }
  .diag-node:hover { box-shadow: 0 0 0 3px rgba(59,91,219,.18); }
  .diag-node.hl { box-shadow: 0 0 0 4px rgba(59,91,219,.45); }
  .diag-node .ntag { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-top: 3px; }
  .edge-label {
    /* max-content rather than an inline width: restyling for the border mode rewrites the whole
       style attribute, and a width written there wouldn't survive it */
    margin: 8px; width: max-content;
    font-size: 10.5px; padding: 1px 7px; border-radius: 8px; background: #fff;
    border: 2px solid transparent; white-space: nowrap; cursor: pointer; pointer-events: auto;
    box-shadow: 0 1px 1px rgba(0,0,0,.05); transition: opacity .18s;
  }
  .edge-label:hover { box-shadow: 0 0 0 2px rgba(59,91,219,.15); }

  /* Off-screen box that sizes a node or label before dagre can place it. visibility rather than
     display, which would measure zero. */
  .diagram-measure { position: absolute; left: -9999px; top: 0; visibility: hidden; width: max-content; }

  /* Zoom controls — mirrors the Color key across the pane, and the playground's diagram pane */
  .zoom-controls {
    position: absolute; right: 14px; bottom: 14px; z-index: 8;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoom-btn {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.97); border: 1px solid var(--line-strong);
    box-shadow: 0 2px 12px rgba(0,0,0,.10);
    color: var(--muted); font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
  }
  .zoom-btn:hover { border-color: var(--accent); color: var(--text); }
  .zoom-btn svg { width: 15px; height: 15px; }

  /* Focus mode — fade the unrelated, emphasise the selection's neighbours */
  .diagram.focus-mode .diag-node.faded { opacity: .17; filter: saturate(.35); }
  .diagram.focus-mode .edge-label.faded { opacity: .12; }
  .diagram.focus-mode path.edge.faded { opacity: .12; }
  .diagram.focus-mode path.edge.incident { stroke: #5b616b; stroke-width: 2.2; }

  /* Color key / legend */
  .legend {
    position: absolute; left: 14px; bottom: 14px; z-index: 8;
    background: rgba(255,255,255,.97); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 8px 11px 10px; box-shadow: 0 2px 12px rgba(0,0,0,.10);
    font-size: 11.5px; max-width: 252px;
  }
  .legend-title {
    display: block; width: 100%; text-align: left; background: none; border: none; padding: 0;
    font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    cursor: pointer; margin-bottom: 6px;
  }
  .legend.collapsed .legend-body { display: none; }
  .legend.collapsed .legend-title { margin-bottom: 0; }
  .legend-group { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin: 4px 0 3px; }
  .legend-group:first-child { margin-top: 0; }
  /* border-color mode lives here rather than in an app-bar gear: it's the setting the Color
     key exists to explain, and it sits next to the diagram it changes */
  .legend-modes { display: flex; gap: 4px; margin-bottom: 6px; }
  .legend-mode {
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 2px 8px; font: inherit; font-size: 10.5px; cursor: pointer;
  }
  .legend-mode:hover { border-color: var(--accent); }
  .legend-mode.active { background: #23262b; color: #fff; border-color: #23262b; }
  .legend-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; color: #3d4149; }
  .legend .sw { width: 18px; height: 12px; border-radius: 3px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,.10); }

  /* Claim-inspector popup */
  .claim-pop {
    position: absolute; z-index: 20; width: 272px;
    background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.20);
    padding: 12px 13px 13px; font-size: 12px; max-height: 82%; overflow: auto;
  }
  .claim-pop { transform: translateY(-50%); }
  /* A pan moves the node it points at every frame; re-measuring that per frame is the expensive
     way, so it goes invisible for the gesture and comes back where the node landed. */
  .claim-pop.settling { visibility: hidden; }
  .claim-pop .cp-close {
    position: absolute; top: 6px; right: 8px; border: none; background: none;
    color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px;
  }
  .claim-pop .cp-close:hover { color: var(--text); }
  .cp-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 5px; padding-right: 16px; }
  .cp-claim {
    display: inline-block; border-radius: 8px; padding: 4px 9px; font-size: 12.5px;
    line-height: 1.3; border: 2px solid transparent; font-style: italic;
  }
  .cp-claim b { font-style: normal; }
  .cp-section { margin-top: 12px; }
  .cp-section > .cp-label { margin-bottom: 6px; }
  .cp-scores { display: flex; flex-direction: column; gap: 4px; }
  .cp-score-row { display: flex; align-items: center; gap: 8px; }
  .cp-score-row .who { width: 46px; color: #3d4149; }
  .cp-chip { min-width: 30px; text-align: center; border-radius: 6px; padding: 1px 6px; font-size: 11.5px; }
  .cp-avg { margin-top: 6px; color: var(--muted); font-size: 11px; }
  .cp-args { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .cp-col h5 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .cp-col.pro h5 { color: #1b4fa8; }
  .cp-col.con h5 { color: #b2182b; }
  .cp-arg { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .cp-arg:last-child { margin-bottom: 0; }
  .cp-arg .relation-word { font-size: 10.5px; }
  .cp-arg .pill { white-space: normal; }
  .cp-none { color: var(--muted); font-size: 11px; }
  .cp-note { margin-top: 10px; color: var(--muted); font-size: 11px; line-height: 1.45; }

  /* Question view panels (replace diagram when a guiding question is selected) */
  .qview-scroll { position: absolute; inset: 0; overflow: auto; padding: 16px; }
  .qview { max-width: 860px; margin: 0 auto; }
  .qview h3 { font-size: 15px; margin: 0 0 4px; }
  .qview .sub { color: var(--muted); margin: 0 0 16px; font-size: 12.5px; }
  .pros { display: flex; flex-direction: column; gap: 12px; }
  .pro-card {
    display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; flex-wrap: wrap;
  }
  .pro-card .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .pro-card .badge.pro { background: #e7f0ff; color: #1b4fa8; }
  .pro-card .badge.con { background: #fdecea; color: #b2182b; }

  /* pros | cons two-column layout (for "why might we want ...") */
  .pros-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pc-head { margin: 0 0 10px; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .pc-head.pro { color: #1b4fa8; }
  .pc-head.con { color: #b2182b; }
  .pc-head .dir { font-size: 15px; }

  /* mini causes diagram (for "why do people immigrate illegally?") */
  .mini-diagram {
    position: relative; width: 100%; max-width: 820px; margin: 4px auto 0; aspect-ratio: 1000 / 430;
  }
  .mini-diagram svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .mini-diagram svg path { fill: none; stroke-width: 2; }
  .mini-node {
    position: absolute; transform: translate(-50%, -50%);
    width: 138px; text-align: center; font-size: 11px; line-height: 1.2;
    border-radius: 11px; padding: 6px 8px; border: 3px solid transparent; background: #fff;
    cursor: pointer; z-index: 2; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .mini-node:hover { box-shadow: 0 0 0 3px rgba(59,91,219,.18); }

  table.tradeoffs { border-collapse: collapse; width: 100%; background: var(--panel); }
  table.tradeoffs th, table.tradeoffs td { border: 1px solid var(--line); padding: 8px 10px; text-align: center; vertical-align: middle; }
  table.tradeoffs th { background: var(--bg); font-weight: 600; font-size: 12.5px; }
  table.tradeoffs th.crit { text-align: left; }
  table.tradeoffs .cell-score { display: inline-block; min-width: 34px; border-radius: 6px; padding: 3px 6px; font-size: 12px; }
  table.tradeoffs td.na { color: var(--muted); }
  .crit-weight { display: block; font-size: 10.5px; color: var(--muted); font-weight: 400; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: #23262b; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 50; max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <!-- Prototype scaffolding: shared across every wireframe, see prototype-bar.js. -->
  <div id="protoBarSlot"></div>
  <script>
    // Per-version facts for prototype-bar.js; written once when this version is cut.
    window.CURRENT_VERSION = "8";
    window.WHATS_NEW_HTML = `
      <div class="ver">v8 &mdash; changes since v7</div>
      <ol>
        <li><b>dagre lays the diagram out.</b> v7 spread each layer evenly and drew every edge as a straight line between two centers, so long edges ran through unrelated boxes. dagre minimizes crossings and routes around them, and each edge is drawn as one bending curve, the same B-spline the ontology playground's diagrams use.</li>
        <li><b>Edge labels get reserved space</b> instead of being nudged to 40% along the line to dodge collisions. dagre is told each label's real size and hands back where it fits.</li>
        <li><b>The diagram pans and zooms.</b> Drag anywhere to pan, wheel over the diagram to zoom, or use the zoom in / zoom out / fit-to-screen buttons at the bottom right. The pane no longer scrolls or forces a 1240px floor, so a narrow split zooms out rather than clipping.</li>
        <li><b>The claim popup is chrome, not diagram content.</b> It keeps its size as the diagram scales under it, sits beside whichever side of the node has room, and hides for the length of a pan rather than being redrawn every frame.</li>
      </ol>
    `;
  </script>
  <script src="prototype-bar.js"></script>

  <!-- Top bar -->
  <header class="topbar">
    <button class="hamburger" title="Menu (stub)" data-stub="Menu isn't wired up in this wireframe.">&#9776;</button>
    <div class="crumb"><span class="owner">keyserj / </span>build-a-wall</div>
    <div class="spacer"></div>
    <div class="persp-chip" data-stub="Perspective switching isn't wired up in this wireframe.">
      <span>&#128101;</span> alice, bob, casey
    </div>
    <div class="avatar" title="danny (viewer)" data-stub="You're viewing as danny.">D</div>
  </header>

  <div class="panes" id="panes">
    <!-- ================= AGENDA PANE ================= -->
    <aside class="agenda">
      <div class="section">
        <h2 style="margin-bottom:8px">Topic</h2>
        <p class="desc" id="topicDesc"></p>
      </div>

  ]
};

/* OVERRIDES - what no part of the ontology says, so this view has to. */
const OVERRIDES = {
  /* The syntax carries no timestamps, so "Most active" is authored. Keyed by node or
     edge id, the way DATA keys everything else. */
  active: ["wall-reduces", "how-tall", "long-wait"],

  /* Which canned view a question opens, and the phrasing that embeds concept pills.
     DATA carries a question's plain text; both of these are the view's call. */
  questions: {
    "why-wall": { view: "pros", parts: [{ t: "Why might we want " }, { node: "wall" }, { t: "?" }] },
    "best-ways": { view: "tradeoffs", parts: [{ t: "What are the most effective ways to reduce " }, { node: "illegal-immig" }, { t: "?" }] },
    "why-immigrate": { view: "causes", parts: [{ t: "Why do people immigrate illegally?" }] },
  },
};

/* ============================================================
   ADAPTER - the bundle under the names the rendering already reads.
   ============================================================ */
const SCORERS = DATA.perspectives;
const TOPIC_DESC = DATA.topic.description;

const NODES = {};
for (const [id, node] of Object.entries(DATA.nodes)) {
  NODES[id] = {
    label: node.label,
    kind: node.kind,
    // a written #tag and a subtype an edge implies read the same on a pill
    tag: [...node.tags, ...node.subtypes].join(" \u00b7 ") || undefined,
    scores: node.scores,
  };
}

/* Two things the syntax leaves unscored that this view still colors, each borrowing the
   edge that carries the score: a criterion's importance is its `criterion for` score, and
   a question's is the `guides` edge it sets its agenda through. Borrowing is the view's
   call - the ontology deliberately keeps the score on the edge. */
for (const edge of Object.values(DATA.edges)) {
  if (edge.relation !== "criterion for" && edge.relation !== "guides") continue;
  if (NODES[edge.from].scores === null) NODES[edge.from].scores = edge.scores;
}

const QUESTIONS = DATA.questions.map(q => ({
  id: q.id,
  guides: q.guidingScore,
  ...OVERRIDES.questions[q.id],
}));

function isQuestionNode(id){ return NODES[id].kind === "guiding" || NODES[id].kind === "clarifying"; }

/* A highlight names what it points at; DATA.nodes / DATA.edges say the rest, and `hotness`
   carries every signal's score even where only one of them listed the item. A question row
   has its own shape, so it's a third kind here even though DATA knows only two. */
const HOTTEST = DATA.highlights.map(item => ({
  ...item,
  ...(item.kind === "edge" ? DATA.edges[item.id] : { scores: NODES[item.id].scores }),
  kind: item.kind === "node" && isQuestionNode(item.id) ? "question" : item.kind,
  categories: OVERRIDES.active.includes(item.id)
    ? [...item.categories, "active"]
    : item.categories,
}));

const CATEGORIES = {
  "change-importance": { icon: "△", label: "Important to change" },
  controversy:       { icon: "🔥", label: "Controversial" },
  unknown:             { icon: "?", label: "Unknowns" },
  active:              { icon: "💬", label: "Most active" },
};

/* Diagram: concept-only nodes (questions excluded). dagre derives the bottom-to-top
   layering from the causal edges below and minimizes crossings itself; NODE_ORDER is
   only the order nodes are handed to it, which is the tiebreak it falls back to. */
const DIAGRAM_NODE_IDS = [
  "illegal-immig", "legal-immig", "long-wait", "wall-cost",
  "danger", "save-money", "disappear", "admin-burden", "more-admin", "wall",
];
const NODE_ORDER = {
  "more-admin": 0, "admin-burden": 1, "danger": 2, "save-money": 3, "disappear": 4, "wall": 5, // bottom layer
  "long-wait": 0, "wall-cost": 1,  // layer 1
  "legal-immig": 0,                // layer 2
  "illegal-immig": 0,              // top layer
};
/* Edges point from the acting/causing node (lower) to the affected node (higher). */
const DIAGRAM_EDGES = [
  { from: "wall",         to: "illegal-immig", relation: "reduces", scores: [3, -5, 8] },
  { from: "legal-immig",  to: "illegal-immig", relation: "reduces", scores: [3, 7, 1] },
  { from: "more-admin",   to: "long-wait",     relation: "reduces", scores: [7, 8, null] },
  { from: "admin-burden", to: "long-wait",     relation: "causes",  scores: [7, null, 8] },
  { from: "long-wait",    to: "illegal-immig", relation: "causes",  scores: [6, 2, null] },
  { from: "danger",       to: "illegal-immig", relation: "causes",  scores: [7, 8, 3] },
  { from: "save-money",   to: "illegal-immig", relation: "causes",  scores: [4, null, 7] },
  { from: "disappear",    to: "illegal-immig", relation: "causes",  scores: [2, null, 6] },
  { from: "wall",         to: "wall-cost",     relation: "causes",  scores: [8, 8, 8] },
  { from: "long-wait",    to: "legal-immig",   relation: "impedes", scores: [6, 8, null] },
];

/* ============================================================
   COLOR HELPERS — colorblind-safe RdBu diverging + purple for guides.
   ============================================================ */
const RB = { neg: "#b2182b", mid: "#e9e9e9", pos: "#2166ac" }; // red .. gray .. blue
const PURPLE = { lo: "#e6dcf0", hi: "#6a3d9a" };

function hex2rgb(h){ h = h.replace("#",""); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgb2hex(a){ return "#" + a.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join(""); }
function mix(c1, c2, t){ const a = hex2rgb(c1), b = hex2rgb(c2); return rgb2hex(a.map((v,i) => v + (b[i]-v)*t)); }

// change-importance / edge weight: -8..8 -> red..gray..blue
function colorRB(s){ if (s < 0) return mix(RB.neg, RB.mid, (s+8)/8); return mix(RB.mid, RB.pos, s/8); }
// guides weight: 0..8 -> light..deep purple
function colorPurple(s){ return mix(PURPLE.lo, PURPLE.hi, Math.max(0,s)/8); }
function colorFor(s, palette){ return palette === "purple" ? colorPurple(s) : colorRB(s); }
function tint(c){ return mix(c, "#ffffff", 0.82); }

/* How a border reads a set of scorers. "average" merges them into one color and is the
   default, because side-by-side hues on every element read as noise to someone arriving;
   "disagreement" bands them, which is what you want when hunting contested claims. */
let borderMode = "average";

/* Build inline style for a pill/node/edge-label from its scores.
   Fill is always a light tint of the average. In disagreement mode the border is equal-width
   HARD-STOP bands, one per scorer sorted by score, so consensus reads near-solid and a split
   reads as distinct side-by-side blocks; the padding-box/border-box background trick keeps
   that banding while respecting border-radius. */
function pillStyle(scores, palette, borderPx){
  borderPx = borderPx || 2;
  if (!scores || scores.every(s => s === null)) {
    return `background:#fff; border:${borderPx}px solid #c4c4c4;`;
  }
  const present = scores.filter(s => s !== null).sort((a,b) => a - b);
  const n = present.length;
  const avg = present.reduce((a,s) => a+s, 0) / n;
  const fill = tint(colorFor(avg, palette));
  if (borderMode === "average") {
    return `background:${fill}; border:${borderPx}px solid ${colorFor(avg, palette)};`;
  }
  const stops = present.map((s,i) => {
    const c = colorFor(s, palette);
    return `${c} ${(i/n*100).toFixed(2)}% ${((i+1)/n*100).toFixed(2)}%`;
  }).join(", ");
  // angled hard bands rather than horizontal, so a split stays legible on a one-line pill
  const grad = `linear-gradient(120deg, ${stops})`;
  return `background:linear-gradient(${fill},${fill}) padding-box, ${grad} border-box;`
       + `border:${borderPx}px solid transparent;`;
}

function paletteForNode(id){ return NODES[id].kind === "guiding" ? "purple" : "rb"; }

/* mean of a scores array, ignoring nulls (0 if all null) */
function avgScore(scores){
  if (!scores) return 0;
  const p = scores.filter(s => s !== null);
  return p.length ? p.reduce((a,s) => a+s, 0) / p.length : 0;
}
/* signed score label: +2 / −8 / 0 / — */
function fmtScore(s){ return (s === null || s === undefined) ? "—" : (s > 0 ? "+" + s : (s < 0 ? "−" + Math.abs(s) : "0")); }

/* Effect-on-target scores for an edge: causes keeps its sign; reduces/impedes flip
   (a "reduce" is a negative effect). This makes causes read blue, reduces/impedes read
   red — colored by what the edge does to its target rather than by belief in the verb. */
function effectScores(relation, scores){
  const flip = (relation === "reduces" || relation === "impedes");
  return (scores || []).map(s => s === null ? null : (flip ? -s : s));
}

/* ============================================================
   PILL / NODE FACTORIES
   ============================================================ */
function makeNodePill(id, opts){
  opts = opts || {};
  const node = NODES[id];
  const el = document.createElement(opts.inline ? "span" : "button");
  el.className = "pill" + (opts.inline ? " inline" : "");
  el.setAttribute("style", pillStyle(node.scores, paletteForNode(id), 2));
  el.dataset.node = id;
  el.textContent = node.label;
  if (opts.tag && node.tag) {
    const t = document.createElement("span"); t.className = "tag"; t.textContent = node.tag; el.appendChild(t);
  }
  if (opts.static) {
    // used for pills embedded in a guiding-question row: let clicks bubble up to select the row
    el.style.cursor = "inherit";
  } else {
    el.addEventListener("click", (e) => { e.stopPropagation(); onNodeActivate(id); });
  }
  return el;
}

/* ============================================================
   RENDER: AGENDA
   ============================================================ */
function renderTopic(){
  document.getElementById("topicDesc").textContent = TOPIC_DESC;
}

function renderQuestions(){
  const list = document.getElementById("qList");
  list.innerHTML = "";
  QUESTIONS.forEach(q => {
    const item = document.createElement("div");
    // re-rendering has to restore the selection, since the rows are rebuilt rather than patched
    item.className = "q-item" + (q.id === selectedQuestion ? " selected" : "");
    item.dataset.q = q.id;

    // purple "guides" dot — deeper purple = guides the topic more (explains the ordering)
    const dot = document.createElement("span");
    dot.className = "q-dot";
    dot.style.background = colorPurple(q.guides * 8);
    dot.title = `Guides the topic — strength ${q.guides.toFixed(2)}`;
    item.appendChild(dot);

    const text = document.createElement("span");
    text.className = "q-text";
    q.parts.forEach(p => {
      if (p.t) text.appendChild(document.createTextNode(p.t));
      if (p.node) text.appendChild(makeNodePill(p.node, { inline: true, static: true }));
    });
    item.appendChild(text);
    item.addEventListener("click", () => toggleQuestion(q.id));
    list.appendChild(item);
  });
}

let hotExpanded = false;
let activeFilter = null; // at most one pill active at a time; null = show all

function renderFilters(){
  const row = document.getElementById("filterRow");
  row.innerHTML = "";
  Object.entries(CATEGORIES).forEach(([key, category]) => {
    const pill = document.createElement("div");
    pill.className = "filter-pill" + (activeFilter === key ? " active" : "");
    pill.innerHTML = `<span class="ic">${category.icon}</span>${category.label}`;
    pill.addEventListener("click", () => {
      activeFilter = (activeFilter === key) ? null : key;
      renderFilters(); renderHottest();
    });
    row.appendChild(pill);
  });
}

function edgePhrase(item){
  const wrap = document.createElement("span");
  wrap.className = "hot-body";
  wrap.appendChild(makeNodePill(item.from, { inline: true }));
  const relation = document.createElement("span"); relation.className = "relation-word"; relation.textContent = " " + item.relation + " "; wrap.appendChild(relation);
  wrap.appendChild(makeNodePill(item.to, { inline: true }));
  relation.style.cursor = "pointer";
  relation.addEventListener("click", (e) => { e.stopPropagation(); onEdgeActivate(item.from, item.to); });
  return wrap;
}

function questionRow(item){
  const q = NODES[item.id];
  const wrap = document.createElement("span");
  wrap.className = "hot-body";
  const el = document.createElement("span");
  el.className = "pill inline";
  el.setAttribute("style", pillStyle(q.scores, "rb", 2));
  el.textContent = q.label;
  el.style.cursor = "default";
  wrap.appendChild(el);
  return wrap;
}

function renderHottest(){
  const list = document.getElementById("hotList");
  list.innerHTML = "";
  let items = HOTTEST.filter(item => !activeFilter || item.categories.includes(activeFilter));
  const limit = hotExpanded ? items.length : 5;
  items.slice(0, limit).forEach(item => {
    const row = document.createElement("div");
    row.className = "hot-row";
    const categories = document.createElement("span");
    categories.className = "categories";
    item.categories.forEach(category => {
      const icon = document.createElement("span");
      icon.textContent = CATEGORIES[category].icon; icon.title = CATEGORIES[category].label;
      categories.appendChild(icon);
    });
    row.appendChild(categories);
    if (item.kind === "edge") row.appendChild(edgePhrase(item));
    else if (item.kind === "question") row.appendChild(questionRow(item));
    else { const b = document.createElement("span"); b.className = "hot-body"; b.appendChild(makeNodePill(item.id, {})); row.appendChild(b); }
    list.appendChild(row);
  });
  const more = document.getElementById("hotMore");
  if (items.length > 5) {
    more.style.display = "";
    more.textContent = hotExpanded ? "Show less" : `Show ${items.length - 5} more`;
  } else {
    more.style.display = "none";
  }
}

/* ============================================================
   RENDER: STRUCTURE DIAGRAM (bottom-to-top layered)
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
/* foreignObject overhang, in graph px - see the .diagram foreignObject rule */
const NODE_PAD = 8;
/* how finely a path is walked when pulling an edge label back onto it, in graph px */
const LABEL_STEP = 2;

let POS = {};   // id -> { x, y, w, h } - center and visual size, in graph px
let panZoom = null;

/* A node's size is whatever the browser makes of its text, and dagre needs that number before it
   can place anything, so each element is built and measured off-screen first. */
function measure(el){
  const box = document.getElementById("diagramMeasure");
  box.appendChild(el);
  const size = { width: el.offsetWidth, height: el.offsetHeight };
  box.removeChild(el);
  return size;
}

function makeDiagramNode(id){
  const node = NODES[id];
  const el = document.createElement("div");
  el.className = "diag-node";
  el.dataset.node = id;
  el.setAttribute("style", pillStyle(node.scores, paletteForNode(id), 3));
  el.innerHTML = node.label + (node.tag ? `<span class="ntag">${node.tag}</span>` : "");
  return el;
}

function makeEdgeLabel(edge){
  const el = document.createElement("div");
  el.className = "edge-label";
  // v4: color by effect on target (causes blue, reduces/impedes red)
  el.setAttribute("style", pillStyle(effectScores(edge.relation, edge.scores), "rb", 2));
  el.dataset.from = edge.from; el.dataset.to = edge.to;
  el.textContent = edge.relation;
  return el;
}

function placeInForeignObject(el, size, cx, cy){
  const fo = document.createElementNS(SVGNS, "foreignObject");
  fo.setAttribute("x", cx - size.width / 2 - NODE_PAD);
  fo.setAttribute("y", cy - size.height / 2 - NODE_PAD);
  fo.setAttribute("width", size.width + NODE_PAD * 2);
  fo.setAttribute("height", size.height + NODE_PAD * 2);
  fo.appendChild(el);
  return fo;
}

function renderDiagram(){
  const viewport = document.getElementById("diagramViewport");
  viewport.replaceChildren();

  const nodeEls = {}, nodeSize = {};
  DIAGRAM_NODE_IDS.forEach(id => {
    nodeEls[id] = makeDiagramNode(id);
    nodeSize[id] = measure(nodeEls[id]);
  });
  const labelEls = [], labelSize = [];
  DIAGRAM_EDGES.forEach((edge, i) => {
    labelEls[i] = makeEdgeLabel(edge);
    labelSize[i] = measure(labelEls[i]);
  });

  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: "BT", nodesep: 30, ranksep: 58, edgesep: 16, marginx: 28, marginy: 28 });
  g.setDefaultEdgeLabel(() => ({}));
  // NODE_ORDER is dagre's tiebreak now rather than the placement itself: crossing minimization
  // reorders a rank, and insertion order is only what it falls back to.
  DIAGRAM_NODE_IDS.slice()
    .sort((a, b) => (NODE_ORDER[a] || 0) - (NODE_ORDER[b] || 0))
    .forEach(id => g.setNode(id, { width: nodeSize[id].width, height: nodeSize[id].height }));
  // giving dagre each label's real size is what reserves room for it, so labels no longer have to
  // be nudged along the line to miss the boxes
  DIAGRAM_EDGES.forEach((edge, i) => g.setEdge(edge.from, edge.to, {
    width: labelSize[i].width, height: labelSize[i].height, labelpos: "c",
  }));
  dagre.layout(g);

  // svg-pan-zoom folds this into its own transform and then drops the attribute, so it reads as
  // dead - it isn't. fit() measures the viewBox when there is one and the content's bbox when
  // there isn't, and only the viewBox carries dagre's margins, which is the breathing room
  // around a fitted diagram.
  const size = g.graph();
  document.getElementById("diagram").setAttribute("viewBox", `0 0 ${size.width} ${size.height}`);

  POS = {};
  DIAGRAM_NODE_IDS.forEach(id => {
    const n = g.node(id);
    POS[id] = { x: n.x, y: n.y, w: nodeSize[id].width, h: nodeSize[id].height };
  });
  // document order is paint order in SVG: lines under the boxes they end on, labels over both
  const paths = DIAGRAM_EDGES.map(edge => {
    const e = g.edge(edge.from, edge.to);
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("class", "edge");
    path.setAttribute("d", edgePath(e.points, edge.from, edge.to));
    path.setAttribute("marker-end", "url(#arrow)");
    path.dataset.from = edge.from; path.dataset.to = edge.to;
    viewport.appendChild(path);
    return path;
  });
  DIAGRAM_NODE_IDS.forEach(id => {
    viewport.appendChild(placeInForeignObject(nodeEls[id], nodeSize[id], POS[id].x, POS[id].y));
  });
  DIAGRAM_EDGES.forEach((edge, i) => {
    const e = g.edge(edge.from, edge.to);
    const at = nearestPointOnPath(paths[i], e);
    viewport.appendChild(placeInForeignObject(labelEls[i], labelSize[i], at.x, at.y));
  });

  initPanZoom();
  if (focusState) applyFocus();
}

/* Border mode only changes colors, so the picture is repainted rather than laid out again -
   which also leaves the current pan and zoom where the reader put them. */
function restyleDiagram(){
  DIAGRAM_NODE_IDS.forEach(id => {
    const el = document.querySelector(`.diag-node[data-node="${id}"]`);
    if (el) el.setAttribute("style", pillStyle(NODES[id].scores, paletteForNode(id), 3));
  });
  DIAGRAM_EDGES.forEach(edge => {
    const el = document.querySelector(`.edge-label[data-from="${edge.from}"][data-to="${edge.to}"]`);
    if (el) el.setAttribute("style", pillStyle(effectScores(edge.relation, edge.scores), "rb", 2));
  });
}

// Boundary point of the target node's rect in the direction of (cx,cy)
function trimToRect(cx, cy, tx, ty, hw, hh){
  const dx = cx - tx, dy = cy - ty;
  if (dx === 0 && dy === 0) return { x: tx, y: ty };
  const sx = dx !== 0 ? hw / Math.abs(dx) : Infinity;
  const sy = dy !== 0 ? hh / Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: tx + dx * s, y: ty + dy * s };
}

/* dagre's endpoints sit on the rank boundary rather than on the box, so both ends are
   re-intersected against the node's own rectangle the way dagre-d3 does it. */
function edgePath(points, from, to){
  const a = POS[from], b = POS[to];
  const first = trimToRect(points[1].x, points[1].y, a.x, a.y, a.w / 2 + 3, a.h / 2 + 3);
  const last = trimToRect(points[points.length - 2].x, points[points.length - 2].y,
                          b.x, b.y, b.w / 2 + 5, b.h / 2 + 5);
  return curveThrough([first, ...points.slice(1, -1), last]);
}

/* A cubic B-spline over dagre's points, written as Beziers - the curve mermaid draws, and the
   reason its edges read as one bend rather than a run of segments.

   It approximates the points instead of passing through them, which is the point: dagre's middle
   point is a label slot rather than a routing bend, and it often sits straight above the source,
   so a curve forced through it has to leave at a right angle and bow outward to come back. A
   B-spline stays inside the hull of its points, so it cuts that corner and never bows out.
   The ends are tripled, which pins the curve to the node borders where the arrowheads land. */
function curveThrough(pts){
  if (pts.length < 3) return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;
  const c = [pts[0], pts[0], ...pts, pts[pts.length - 1], pts[pts.length - 1]];
  let d = `M ${(c[0].x + 4 * c[1].x + c[2].x) / 6} ${(c[0].y + 4 * c[1].y + c[2].y) / 6}`;
  for (let i = 1; i < c.length - 2; i++) {
    const a = c[i], b = c[i + 1], next = c[i + 2];
    d += ` C ${(2 * a.x + b.x) / 3} ${(2 * a.y + b.y) / 3}`
       + ` ${(a.x + 2 * b.x) / 3} ${(a.y + 2 * b.y) / 3}`
       + ` ${(a.x + 4 * b.x + next.x) / 6} ${(a.y + 4 * b.y + next.y) / 6}`;
  }
  return d;
}

/* The curve only approximates dagre's polyline, so the label slot dagre reserved is no longer on
   the line the label belongs to. Walking the drawn path for the nearest point puts it back,
   keeping dagre's choice of roughly where along the edge it sits. */
function nearestPointOnPath(path, target){
  const len = path.getTotalLength();
  let best = path.getPointAtLength(0), bestDist = Infinity;
  for (let l = 0; l <= len; l += LABEL_STEP) {
    const pt = path.getPointAtLength(l);
    const dist = (pt.x - target.x) ** 2 + (pt.y - target.y) ** 2;
    if (dist < bestDist) { bestDist = dist; best = pt; }
  }
  return best;
}

/* ============================================================
   DIAGRAM PAN / ZOOM
   ============================================================ */
function initPanZoom(){
  if (panZoom) { panZoom.updateBBox(); panZoom.resize(); panZoom.fit(); panZoom.center(); return; }
  panZoom = svgPanZoom(document.getElementById("diagram"), {
    viewportSelector: "#diagramViewport",
    zoomEnabled: true, controlIconsEnabled: false, dblClickZoomEnabled: false,
    fit: true, center: true, minZoom: 0.2, maxZoom: 20,
    // uniwheel binds to the SVG itself, so the wheel only zooms while the pointer is over the
    // diagram and keeps scrolling everything else on the page
    mouseWheelZoomEnabled: true,
    onPan: settlePopup, onZoom: settlePopup,
  });
}

/* Pan vs tap: svg-pan-zoom preventDefaults mousedown and touchstart, so clicks are recognized
   here by how far the pointer travelled rather than left to a click event on the node. */
const TAP_SLOP = 6;
let pressedAt = null;
let pannedSinceDown = false;

function initDiagramPointer(){
  const svg = document.getElementById("diagram");
  svg.addEventListener("pointerdown", (e) => {
    pressedAt = e.button === 0 ? { x: e.clientX, y: e.clientY } : null;
    pannedSinceDown = false;
    if (pressedAt) svg.classList.add("panning");
  });
  svg.addEventListener("pointerup", (e) => {
    const from = pressedAt;
    pressedAt = null;
    svg.classList.remove("panning");
    if (!from) return;
    if (Math.hypot(e.clientX - from.x, e.clientY - from.y) > TAP_SLOP) { pannedSinceDown = true; return; }
    const node = e.target.closest(".diag-node");
    if (node) { onNodeActivate(node.dataset.node); return; }
    const label = e.target.closest(".edge-label");
    if (label) onEdgeActivate(label.dataset.from, label.dataset.to);
  });
  svg.addEventListener("pointercancel", () => { pressedAt = null; svg.classList.remove("panning"); });

  document.getElementById("zoomIn").addEventListener("click", () => panZoom && panZoom.zoomBy(1.2));
  document.getElementById("zoomOut").addEventListener("click", () => panZoom && panZoom.zoomBy(0.8));
  document.getElementById("zoomFit").addEventListener("click", () => {
    if (!panZoom) return;
    panZoom.fit(); panZoom.center();
  });

  // svg-pan-zoom measures the SVG once and caches it, so without this every later fit() would
  // scale to the pane's size at load rather than its size now. Re-measuring leaves the current
  // pan/zoom alone; it only refreshes what "fit" means.
  new ResizeObserver(() => {
    const box = document.getElementById("diagramBox");
    // a zero-size measurement (question view showing) would cache a garbage scale
    if (!box.clientWidth || !box.clientHeight) return;
    if (panZoom) panZoom.resize();
  }).observe(document.getElementById("diagramBox"));
}

// Rough static sunburst placeholder: center = topic, one ring of related concepts colored by score.
function buildSunburst(){
  const wrap = document.createElement("figure");
  wrap.className = "sunburst-wrap";
  wrap.style.margin = "0";
  const ring = ["illegal-immig", "danger", "long-wait", "legal-immig", "wall-cost", "more-admin", "save-money", "disappear"];
  const size = 180, cx = size/2, cy = size/2, r0 = 34, r1 = 84;
  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns, "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size); svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
  const per = (Math.PI * 2) / ring.length;
  ring.forEach((id, i) => {
    const a0 = i * per - Math.PI/2, a1 = a0 + per - 0.04;
    const p = document.createElementNS(svgns, "path");
    const x0 = cx + r0*Math.cos(a0), y0 = cy + r0*Math.sin(a0);
    const x1 = cx + r1*Math.cos(a0), y1 = cy + r1*Math.sin(a0);
    const x2 = cx + r1*Math.cos(a1), y2 = cy + r1*Math.sin(a1);
    const x3 = cx + r0*Math.cos(a1), y3 = cy + r0*Math.sin(a1);
    p.setAttribute("d", `M ${x0} ${y0} L ${x1} ${y1} A ${r1} ${r1} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${r0} ${r0} 0 0 0 ${x0} ${y0} Z`);
    const sc = NODES[id].scores.filter(s => s !== null);
    const avg = sc.reduce((a,s)=>a+s,0)/sc.length;
    p.setAttribute("fill", colorRB(avg));
    p.setAttribute("stroke", "#fff"); p.setAttribute("stroke-width", "1.5");
    p.setAttribute("class", "sb-seg");
    p.style.cursor = "pointer";
    p.addEventListener("click", () => highlightNode(id));
    svg.appendChild(p);
  });
  const center = document.createElementNS(svgns, "circle");
  center.setAttribute("cx", cx); center.setAttribute("cy", cy); center.setAttribute("r", r0);
  center.setAttribute("fill", tint(colorRB(1))); center.setAttribute("stroke", "#888"); center.setAttribute("stroke-width", "1.5");
  center.setAttribute("class", "sb-seg");
  center.style.cursor = "pointer";
  center.addEventListener("click", () => highlightNode("wall"));
  svg.appendChild(center);
  const cap = document.createElement("figcaption");
  cap.innerHTML = "Minimap (placeholder) — center is the topic; ring segments are related concepts colored by score. Click a segment to highlight it.";
  wrap.appendChild(svg); wrap.appendChild(cap);
  return wrap;
}

function buildTradeoffs(){
  const actions = ["wall", "more-admin", "fewer-requirements"];
  // fulfils scores per criterion x action; null = not scored in the example

    inexpensive: { wall: [-7,-8,-2], "more-admin": [-3,-4,null], "fewer-requirements": [7,null,6] },
    quick:       { wall: null, "more-admin": null, "fewer-requirements": null },

  };
  const table = document.createElement("table"); table.className = "tradeoffs";
  const thead = document.createElement("thead");

  hr.appendChild(cellTh("Criterion \\ Option", "crit"));
  actions.forEach(a => hr.appendChild(cellTh(NODES[a].label)));
  thead.appendChild(hr); table.appendChild(thead);

  Object.keys(cells).forEach(crit => {
    const tr = document.createElement("tr");

    const cs = NODES[crit].scores.filter(s => s !== null); const avg = cs.reduce((a,s)=>a+s,0)/cs.length;
    w.textContent = `importance ${avg.toFixed(1)}`;
    th.appendChild(w);
    tr.appendChild(th);

      const td = document.createElement("td");

        const span = document.createElement("span"); span.className = "cell-score";

function cellTh(txt, cls){ const th = document.createElement("th"); if (cls) th.className = cls; th.textContent = txt; return th; }

/* ============================================================
   CALCULATED ARGUMENTS (ontology.md → "Calculated arguments")
   From a node's OUTGOING causal edges:
     pro  = causes a positive concept, or reduces/impedes a negative one
     con  = causes a negative concept, or reduces/impedes a positive one
   ============================================================ */
function calcArguments(id){
  const pros = [], cons = [];
  DIAGRAM_EDGES.filter(e => e.from === id).forEach(e => {
    const tAvg = avgScore(NODES[e.to].scores);
    const decreases = (e.relation === "reduces" || e.relation === "impedes");
    const isPro = decreases ? (tAvg < 0) : (tAvg > 0);
    const strength = Math.abs(avgScore(e.scores)) * Math.abs(tAvg);
    (isPro ? pros : cons).push({ relation: e.relation, to: e.to, strength });
  });
  pros.sort((a,b) => b.strength - a.strength);
  cons.sort((a,b) => b.strength - a.strength);
  return { pros, cons };
}

function cpLabel(parent, text){

function argColumn(kind, title, list){

function makePopupShell(){
  const pop = document.createElement("div");
  pop.className = "claim-pop"; pop.id = "claimPop";
  const close = document.createElement("button"); close.className = "cp-close"; close.innerHTML = "&times;";
  close.title = "Close";
  close.addEventListener("click", (e) => { e.stopPropagation(); clearHighlight(); });
  pop.appendChild(close);
  return pop;
}
const POPUP_W = 272; // matches .claim-pop's width, which JS has to know to place it on the left

/* The popup is chrome rather than diagram content, so it lives in the pane and anchors to where
   the node currently renders: it keeps its size while the diagram scales under it, and its gap
   to the node stays a real 12px at any zoom. */
let popupAnchor = null;
function positionPopupAtNode(pop, id){
  const el = document.querySelector(`.diag-node[data-node="${id}"]`);
  if (!el) return;
  popupAnchor = id;
  const nr = el.getBoundingClientRect(), br = document.getElementById("structBody").getBoundingClientRect();
  const gap = 12;
  const fitsRight = br.right - nr.right >= POPUP_W + gap * 2;
  pop.style.left = (fitsRight ? nr.right - br.left + gap : nr.left - br.left - gap - POPUP_W) + "px";
  pop.style.top = (nr.top + nr.height / 2 - br.top) + "px";
}
function hideClaimPopup(){
  const p = document.getElementById("claimPop");
  if (p) p.remove();
  popupAnchor = null;
}

/* Hide for the length of the gesture, then reappear beside wherever the node ended up. */
let popupSettleTimer = null;
function settlePopup(){
  const pop = document.getElementById("claimPop");
  if (!pop) return;
  pop.classList.add("settling");
  clearTimeout(popupSettleTimer);
  popupSettleTimer = setTimeout(() => {
    if (popupAnchor) positionPopupAtNode(pop, popupAnchor);
    pop.classList.remove("settling");
  }, 120);
}

/* Pan the diagram so the whole popup — and therefore the selected node beside it — is in view.
   The pane doesn't scroll any more, so what used to be a scrollBy is the same nudge applied to
   the diagram underneath instead. */
function ensurePopupVisible(pop){
  const body = document.getElementById("structBody");
  const pr = pop.getBoundingClientRect(), br = body.getBoundingClientRect();
  const pad = 14;
  let dx = 0, dy = 0;
  if (pr.right > br.right - pad) dx = pr.right - (br.right - pad);
  else if (pr.left < br.left + pad) dx = pr.left - (br.left + pad);
  if (pr.bottom > br.bottom - pad) dy = pr.bottom - (br.bottom - pad);
  else if (pr.top < br.top + pad) dy = pr.top - (br.top + pad);
  if ((dx || dy) && panZoom) panZoom.panBy({ x: -dx, y: -dy });
}

function showClaimPopupForNode(id){
  hideClaimPopup();
  const node = NODES[id];
  const pop = makePopupShell();

  cpLabel(pop, "Implied claim behind this concept's score");
  const claim = document.createElement("div"); claim.className = "cp-claim";
  claim.setAttribute("style", pillStyle(node.scores, paletteForNode(id), 2));
  claim.textContent = `“${node.label} is important to increase”`;
  pop.appendChild(claim);

  pop.appendChild(scoreSection(node.scores, "Per-scorer scores"));

  const sec = document.createElement("div"); sec.className = "cp-section";
  cpLabel(sec, "Calculated arguments (from causal edges)");
  const { pros, cons } = calcArguments(id);
  if (!pros.length && !cons.length) {
    const note = document.createElement("div"); note.className = "cp-note";
    note.textContent = "No outgoing causal edges here, so this concept's score has no calculated arguments — its neighbours argue about their own scores instead.";
    sec.appendChild(note);
  } else {
    const grid = document.createElement("div"); grid.className = "cp-args";
    grid.appendChild(argColumn("pro", "Pros ↑", pros));
    grid.appendChild(argColumn("con", "Cons ↓", cons));
    sec.appendChild(grid);
  }
  pop.appendChild(sec);

  document.getElementById("structBody").appendChild(pop);
  positionPopupAtNode(pop, id);
}

function showClaimPopupForEdge(from, to){
  hideClaimPopup();
  const edge = DIAGRAM_EDGES.find(e => e.from === from && e.to === to);
  if (!edge) return;
  const flip = (edge.relation === "reduces" || edge.relation === "impedes");
  const eff = effectScores(edge.relation, edge.scores);
  const pop = makePopupShell();

  cpLabel(pop, "Implied claim behind this edge's weight");
  const claim = document.createElement("div"); claim.className = "cp-claim";
  claim.setAttribute("style", pillStyle(eff, "rb", 2));
  // v4: bold the relation (edge) word
  claim.appendChild(document.createTextNode(`“${NODES[from].label} `));
  const relationBold = document.createElement("b"); relationBold.textContent = edge.relation; claim.appendChild(relationBold);
  claim.appendChild(document.createTextNode(` ${NODES[to].label}”`));
  pop.appendChild(claim);

  // effect framing: scores flipped for reduces/impedes so they read as effect-on-target
  pop.appendChild(scoreSection(eff, "Per-scorer effect on the target"));

  const note = document.createElement("div"); note.className = "cp-note";
  note.textContent = `Shown as each scorer's effect on “${NODES[to].label}”: “${edge.relation}” is ${flip ? "a decrease (red)" : "an increase (blue)"}. Split colors = scorers disagree.`;
  pop.appendChild(note);

  document.getElementById("structBody").appendChild(pop);
  positionPopupAtNode(pop, from);
}

/* ============================================================
   FOCUS MODE — fade unrelated, emphasise the selection's neighbours
   ============================================================ */
let focusState = null; // { kind: "node", id } | { kind: "edge", from, to }

function neighborSet(id){
  const set = new Set([id]);
  DIAGRAM_EDGES.forEach(e => {
    if (e.from === id) set.add(e.to);
    if (e.to === id) set.add(e.from);
  });
  return set;
}

function applyFocus(){
  const diagram = document.getElementById("diagram");
  if (!focusState) { diagram.classList.remove("focus-mode"); return; }
  diagram.classList.add("focus-mode");

  if (focusState.kind === "node") {
    const id = focusState.id;
    const nb = neighborSet(id);
    document.querySelectorAll(".diag-node").forEach(el => {
      el.classList.toggle("hl", el.dataset.node === id);
      el.classList.toggle("faded", !nb.has(el.dataset.node));
    });
    document.querySelectorAll("#diagramViewport path.edge").forEach(p => {
      const inc = p.dataset.from === id || p.dataset.to === id;
      p.classList.remove("hl");
      p.classList.toggle("incident", inc);
      p.classList.toggle("faded", !inc);
      p.setAttribute("marker-end", inc ? "url(#arrowFocus)" : "url(#arrow)");
    });
    document.querySelectorAll(".edge-label").forEach(l => {
      l.classList.toggle("faded", !(l.dataset.from === id || l.dataset.to === id));
    });
  } else {
    const { from, to } = focusState;
    document.querySelectorAll(".diag-node").forEach(el => {
      const on = el.dataset.node === from || el.dataset.node === to;
      el.classList.toggle("hl", on);
      el.classList.toggle("faded", !on);
    });
    document.querySelectorAll("#diagramViewport path.edge").forEach(p => {
      const on = p.dataset.from === from && p.dataset.to === to;
      p.classList.remove("incident");
      p.classList.toggle("hl", on);
      p.classList.toggle("faded", !on);
      p.setAttribute("marker-end", on ? "url(#arrowHl)" : "url(#arrow)");
    });
    document.querySelectorAll(".edge-label").forEach(l => {
      l.classList.toggle("faded", !(l.dataset.from === from && l.dataset.to === to));
    });
  }
}

/* ============================================================
   RENDER: COLOR KEY
   ============================================================ */
/* The bottom row demonstrates the active mode on scores of its own: a wide split for
   disagreement, and a same-sign pair for average, since any pair straddling zero averages
   to the gray that the row above already claims for "no change". */
function renderLegend(){
  const disagreement = borderMode === "disagreement";
  document.querySelectorAll("#legendModes .legend-mode")
    .forEach(b => b.classList.toggle("active", b.dataset.mode === borderMode));
  document.getElementById("legendSweep")
    .setAttribute("style", pillStyle(disagreement ? [-8, 8] : [4, 8], "rb", 2));
  document.getElementById("legendSweepText").textContent =
    disagreement ? "Split colors = scorers disagree" : "One color = scorers averaged";
}

/* Every colored element takes its border from pillStyle, so switching mode means re-running
   the renders. The claim popup is dropped rather than re-rendered - it reopens from whatever
   it was describing. */
function rerenderForBorderMode(){
  clearHighlight();
  renderQuestions();
  renderHottest();
  renderLegend();
  // repainted even while a question view hides it, or its nodes would still be in the old mode on
  // the way back
  restyleDiagram();
  const q = selectedQuestion ? QUESTIONS.find(x => x.id === selectedQuestion) : null;
  if (q) { renderQuestionView(q); renderSummaryForQuestion(q); }
  else { renderSummary(); }
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
let lastHighlighted = null;

function onNodeActivate(id){
  if (lastHighlighted === id) { toast(`Details view for “${NODES[id].label}” isn't designed yet.`); return; }
  highlightNode(id);
}

function clearHighlight(){
  focusState = null;
  document.querySelectorAll(".diag-node").forEach(el => el.classList.remove("hl", "faded"));
  document.querySelectorAll("#diagramViewport path.edge").forEach(p => {
    p.classList.remove("hl", "incident", "faded"); p.setAttribute("marker-end", "url(#arrow)");
  });
  document.querySelectorAll(".edge-label").forEach(l => l.classList.remove("faded"));
  document.getElementById("diagram").classList.remove("focus-mode");
  hideClaimPopup();
  lastHighlighted = null;
}

function highlightNode(id){
  if (selectedQuestion) toggleQuestion(selectedQuestion); // return to default diagram
  const inDiagram = DIAGRAM_NODE_IDS.includes(id);
  if (!inDiagram) {
    clearHighlight();
    lastHighlighted = id;
    toast(`“${NODES[id].label}” isn't among the concepts shown here.`);
    return;
  }
  focusState = { kind: "node", id };
  applyFocus();
  showClaimPopupForNode(id);
  lastHighlighted = id;
  ensurePopupVisible(document.getElementById("claimPop"));
}

function onEdgeActivate(from, to){
  if (selectedQuestion) toggleQuestion(selectedQuestion);
  focusState = { kind: "edge", from, to };
  applyFocus();
  showClaimPopupForEdge(from, to);
  lastHighlighted = null;
  ensurePopupVisible(document.getElementById("claimPop"));
}

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============================================================
   DRAG-RESIZABLE SPLIT PANE
   ============================================================ */
function initDivider(){
  const panes = document.getElementById("panes");
  const agenda = document.querySelector(".agenda");
  const divider = document.getElementById("divider");
  let dragging = false;

  divider.addEventListener("pointerdown", (e) => {
    dragging = true;
    divider.classList.add("dragging");
    divider.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  divider.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const rect = panes.getBoundingClientRect();
    const min = 280, max = rect.width - 360 - 6; // keep structure >= 360px
    let w = Math.max(min, Math.min(max, e.clientX - rect.left));
    agenda.style.width = w + "px";
  });
  const stop = () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
  };
  divider.addEventListener("pointerup", stop);
  divider.addEventListener("pointercancel", stop);
}

/* ============================================================
   WIRING
   ============================================================ */
function init(){
  renderTopic();
  renderQuestions();
  renderFilters();
  renderHottest();
  renderSummary();
  renderLegend();
  // last: the summary strip's height is what's left over for the diagram, and the initial
  // fit has to measure the pane at the size it ends up
  renderDiagram();
  initDiagramPointer();
  initDivider();

  document.querySelectorAll("#legendModes .legend-mode").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.mode === borderMode) return;
      borderMode = b.dataset.mode;
      rerenderForBorderMode();
    });
  });
  document.getElementById("legendToggle").addEventListener("click", (e) => {
    e.stopPropagation();
    const lg = document.getElementById("legend");
    lg.classList.toggle("collapsed");
    document.getElementById("legendToggle").innerHTML =
      "Color key " + (lg.classList.contains("collapsed") ? "▸" : "▾");
  });

  document.getElementById("hotMore").addEventListener("click", () => { hotExpanded = !hotExpanded; renderHottest(); });

  // the shown tab and the collapse state are one state: re-clicking the tab that's showing hides it
  document.querySelectorAll("#summaryTabs .summary-tab").forEach(b => {
    b.addEventListener("click", () => {
      // read the active class rather than summaryMode: a selected question forces the Summary
      // tab active without changing the mode, and what's marked active is what the user sees
      if (b.classList.contains("active") && !isSummaryCollapsed()) { setSummaryCollapsed(true); return; }
      summaryMode = b.dataset.mode;
      if (selectedQuestion) showDefaultView();
      renderSummary();
      setSummaryCollapsed(false);
    });
  });
  // anywhere else on the row - the chevron included - toggles, the way the Color key's title does
  document.getElementById("summaryTabs").addEventListener("click", (e) => {
    if (e.target.closest(".summary-tab")) return;
    setSummaryCollapsed(!isSummaryCollapsed());
  });

  document.querySelectorAll("[data-stub]").forEach(el => el.addEventListener("click", () => toast(el.dataset.stub)));

  // Clear the highlight when clicking truly blank space (not a highlight source or popup).
  document.addEventListener("click", (e) => {
    // a pan that ends on blank canvas still fires a click there, and it must not drop the selection
    if (pannedSinceDown) { pannedSinceDown = false; return; }
    if (e.target.closest(".diag-node, .edge-label, .pill, .ref, .sb-seg, .claim-pop, .legend, .mini-node, .zoom-controls")) return;
    clearHighlight();
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
