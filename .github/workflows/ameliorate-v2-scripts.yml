# Nothing under scripts/ or examples/ is deployed except examples/build-a-wall.txt, which is
# bundled in the playground. A wireframe pastes the generated bundle rather than loading it, so
# these checks are their own workflow instead of a step in the deploy, where a failing test would
# block a site that had nothing to change.
name: Check ameliorate-v2 scripts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ameliorate-v2-scripts.yml"
      - "ameliorate-v2/.oxlintrc.json"
      - "ameliorate-v2/package-lock.json"
      - "ameliorate-v2/package.json"
      - "ameliorate-v2/tsconfig.json"
      - "ameliorate-v2/vitest.config.ts"
      - "ameliorate-v2/examples/**"
      - "ameliorate-v2/scripts/**"
      # The scripts reach into the playground for parser/model code instead of a shared package.
      # Changes to these dependencies must run the scripts' checks.
      - "ontology-playground/src/ontology/ids.ts"
      - "ontology-playground/src/ontology/types.ts"
      - "ontology-playground/src/ontology/ameliorate-v2/diagnostics.ts"
      - "ontology-playground/src/ontology/ameliorate-v2/ids.ts"
      - "ontology-playground/src/ontology/ameliorate-v2/markers.ts"
      - "ontology-playground/src/ontology/ameliorate-v2/model.ts"
      - "ontology-playground/src/ontology/ameliorate-v2/parse.ts"
      - "ontology-playground/src/ontology/ameliorate-v2/scores.ts"
      - "ontology-playground/src/ontology/ameliorate-v2/validate.ts"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ameliorate-v2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ameliorate-v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run format:check
