<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic landing v10 — build-a-wall</title>
<!--
  Clickable wireframe for the "topic selected" state (nothing else selected). v10.
  Generated from ameliorate-v2/UX-design.md + ontology.md ("Build a wall" example),
  viewed as danny (no own scores; sees alice/bob/casey aggregated).
  Depends on versions.js and prototype-bar.js for the prototype bar, and on
  vendor/dagre.min.js + vendor/svg-pan-zoom.min.js for the diagram; everything
  else is inline. Clickable, not functional.

  Context + the version switcher live in the prototype bar at the very top
  (the "i" button, and "version N" next to it) - that bar is scaffolding, not design.

  v10 changes are listed in the "i" popover ("What's new" tab). Headlines:
    - the minimap is derived: every causal node reachable from the topic, ringed
      by distance from it, with relation glyphs on the ring boundaries
    - a segment the diagram isn't drawing is faded, so the minimap says what the
      filters are hiding
    - an edge outside the diagram is one box rather than two bordered nodes
  See ai-designs/derived-minimap.md.
-->
<script src="versions.js"></script>
<!-- Layout + pan/zoom for the structure diagram. Plain <script src> like the prototype bar's
     files, so the wireframe still opens over file://; see ai-designs/dagre-layout-and-pan-zoom.md -->
<script src="vendor/dagre.min.js"></script>
<script src="vendor/svg-pan-zoom.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e2e4e8;
    --line-strong: #cfd2d8;
    --text: #23262b;
    --muted: #6b7079;
    --accent: #3b5bdb;
    --purple: #6a3d9a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.4;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 900px;
  }

  /* ---- Top bar ---- */
  .topbar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .topbar .hamburger {
    font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted);
    background: none; border: none; padding: 4px 6px; border-radius: 6px;
  }
  .topbar .hamburger:hover { background: var(--bg); }
  .topbar .crumb { font-weight: 600; }
  .topbar .crumb .owner { color: var(--muted); font-weight: 500; }
  .topbar .spacer { flex: 1; }
  .persp-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 4px 10px; color: var(--muted); cursor: pointer; background: var(--bg);
    font-size: 12.5px;
  }
  .persp-chip:hover { border-color: var(--accent); color: var(--text); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #dfe3ea; color: #444; display: flex; align-items: center; justify-content: center;
    font-weight: 600; cursor: pointer;
  }

  /* ---- Prototype scaffolding: version switcher + info popover ----
     Housed in prototype-bar.js - see that file's own header. */

  /* ---- Panes (drag-resizable split) ---- */
  .panes { flex: 1 1 auto; display: flex; min-height: 0; }
  .agenda {
    flex: 0 0 auto; width: 46%; min-width: 280px;
    background: var(--panel); overflow-y: auto; padding: 18px 18px 40px;
  }
  .divider {
    flex: 0 0 6px; position: relative; cursor: col-resize;
    background: var(--line); z-index: 9;
  }
  .divider::before { content: ""; position: absolute; inset: 0 -5px; } /* wider hit area */
  .divider:hover, .divider.dragging { background: var(--accent); }
  .structure {
    position: relative;
    flex: 1 1 0; min-width: 360px; display: flex; flex-direction: column; background: var(--bg);
  }

  /* ---- Agenda sections ---- */
  .section { padding: 6px 0 14px; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: none; }
  .section h2 {
    font-size: 15px; margin: 6px 0 10px; letter-spacing: .2px;
  }
  .desc { color: #3d4149; margin: 4px 0 2px; }

  /* Pills (nodes / edges / references) */
  .pill {
    display: inline-flex; align-items: center; text-align: left;
    border-radius: 10px; padding: 3px 9px; cursor: pointer;
    font-size: 12.5px; line-height: 1.25; vertical-align: middle;
    border: 2px solid transparent; background: #fff;
    max-width: 100%;
  }
  .pill.inline { font-size: inherit; padding: 1px 7px; border-radius: 8px; margin: 0 1px; }
  .pill:hover { filter: brightness(0.97); box-shadow: 0 0 0 2px rgba(59,91,219,.15); }
  .pill .nicon { color: var(--muted); margin-right: 4px; font-weight: 600; }
  /* stadium, like the edge boxes in the diagram - what says a box is an edge rather than a node.
     999px keeps the ends round on the one-line case and reads as a lozenge when it wraps. */
  .edge-phrase {
    display: inline-flex; align-items: center; flex-wrap: wrap; text-align: left;
    border-radius: 999px; padding: 3px 11px; cursor: pointer;
    font-size: 12.5px; line-height: 1.3; vertical-align: middle;
    border: 2px solid transparent; background: #fff; max-width: 100%;
  }
  .edge-phrase:hover { filter: brightness(0.97); box-shadow: 0 0 0 2px rgba(59,91,219,.15); }
  /* the relation is the only word in the box that isn't a node's name, and it's what the box's
     color is about */
  .edge-phrase b { margin: 0 4px; }
  .pill .tag { font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-left: 6px; }

  /* Explore questions */
  .q-list { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .q-item {
    display: flex; align-items: flex-start; gap: 8px;
    cursor: pointer; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent;
  }
  .q-item:hover { background: var(--bg); }
  .q-item.selected { background: #eef1fc; border-color: #c7d0f5; }
  .q-dot {
    flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; margin-top: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset;
  }
  .q-text { flex: 1; min-width: 0; }

  /* Highlights */
  .filter-row { display: flex; gap: 8px; margin: 4px 0 8px; flex-wrap: wrap; }
  .filter-pill {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 11px;
    cursor: pointer; font-size: 12.5px; background: var(--panel); color: var(--muted);
    user-select: none;
  }
  .filter-pill:hover { border-color: var(--accent); }
  .filter-pill.active { background: #23262b; color: #fff; border-color: #23262b; }
  .filter-pill .ic { font-size: 12px; }

  .hot-list { display: flex; flex-direction: column; gap: 2px; }
  /* padding/radius/hover match .q-item, so Highlights reads at the same density as Explore questions */
  .hot-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 8px; }
  .hot-row:hover { background: var(--bg); }
  /* fixed-width icon column so every row's body starts at the same x; icons centred so a
     single icon lines up with the centre of a double-icon stack */
  .hot-row .categories { flex: 0 0 40px; display: inline-flex; justify-content: center; gap: 1px; padding-top: 2px; }
  .hot-row .categories span { width: 18px; text-align: center; font-size: 12px; line-height: 1.25; display: inline-block; }
  .hot-body { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .show-more {
    margin-top: 10px; background: none; border: none; color: var(--accent);
    cursor: pointer; font-size: 12.5px; padding: 2px 0;
  }
  .show-more:hover { text-decoration: underline; }

  /* ---- Structure pane ---- */
  .struct-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .struct-head h2 { font-size: 15px; margin: 0; }

  /* Summary strip — the tab row stays visible when collapsed, so there's always
     something to click to bring the body back */
  .summary { border-bottom: 1px solid var(--line); background: var(--panel); }
  /* the whole row collapses the summary, so it hovers and takes a pointer like the Color key's title */
  .summary-tabs { display: flex; align-items: center; gap: 2px; padding: 0 12px; cursor: pointer; }
  /* --line rather than the --bg the agenda rows hover to: this strip is full-width with no
     unhovered sibling beside it to compare against, and --bg's 4% step goes unnoticed there */
  .summary-tabs:hover { background: var(--line); }
  /* the row is the control, so the chevron is only its state indicator - no button chrome, and it
     brightens with the row rather than hovering on its own */
  .summary-collapse {
    border: none; background: none; padding: 0 4px; margin-left: 6px;
    color: var(--muted); font-size: 11px; line-height: 1; cursor: pointer;
  }
  .summary-tabs:hover .summary-collapse { color: var(--text); }
  .summary-tab {
    border: none; background: none; cursor: pointer; font: inherit; font-size: 12.5px;
    color: var(--muted); padding: 9px 8px 8px; border-radius: 7px 7px 0 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  /* a step darker than the row's own hover, which is always under it when a tab is hovered */
  .summary-tab:hover { color: var(--text); background: var(--line-strong); }
  .summary-tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  /* collapsed hides the body, so the active tab reads as unselected too - nothing is "showing" */
  .summary.collapsed .summary-tab.active { color: var(--muted); font-weight: normal; border-bottom-color: transparent; }
  .summary-body { padding: 8px 16px 14px; }
  .summary.collapsed .summary-body { display: none; }
  /* inline-block refs (own compact line-height, matching the agenda's inline pills) so
     wrapped pill lines get row spacing from the paragraph without inflating pill height */
  .summary-body p { margin: 0; color: #3d4149; line-height: 1.85; }
  .summary-body .ref {
    display: inline-block; border-radius: 8px; padding: 1px 7px; margin: 0 1px;
    font-size: inherit; line-height: 1.25; vertical-align: middle;
    cursor: pointer; border: 2px solid transparent; white-space: nowrap;
  }
  .summary-body .ref:hover { box-shadow: 0 0 0 2px rgba(59,91,219,.15); }
  /* the caption sits in the column beside the sunburst rather than under it, so the strip's height
     is the diameter alone - every row of caption below it would come off the diagram */
  /* minmax(0,1fr) rather than 1fr on the outer columns: the caption's width would otherwise size
     its own column and push the sunburst off center */
  .sunburst-wrap { margin: 0; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 20px; }
  .sunburst-wrap figcaption { color: var(--muted); font-size: 12px; line-height: 1.5; max-width: 320px; }
  .sunburst { display: block; }
  /* the seam and the hollow outline are both the stroke, and which one a segment wears depends on
     its data - so the color is a presentation attribute, which :hover and .hl still outrank */
  .sb-seg { stroke-width: 1.5; cursor: pointer; }
  /* a segment the diagram isn't drawing keeps its color as an outline; the angular gap between
     wedges is what separates them once the white seam is gone */
  .sb-seg.hollow { stroke-width: 2; }
  .sb-seg:hover { stroke: var(--accent); stroke-width: 2; }
  .sb-seg.hl { stroke: var(--accent); stroke-width: 2.5; }
  /* A white halo under the fill, so a mark colored like its edge survives whatever color the arc
     beneath it is; paint-order puts the stroke down first and the fill covers it. Thin enough that
     the NOT gate's bubble stays a bubble - the two halos meet in the 0.5px gap at the tip, which is
     what draws the gate's break, and a wider one would weld them into a blob.
     Fill is per-glyph and therefore an attribute, not a rule. */
  .sb-glyph {
    stroke: #fff; stroke-width: 1.1; paint-order: stroke;
    stroke-linejoin: round; pointer-events: none;
  }

  /* Diagram — dagre lays out a fixed pixel canvas, svg-pan-zoom moves it under a fixed pane.
     Nodes and edge labels stay HTML inside foreignObject so pillStyle's gradient border, which
     is a padding-box/border-box background trick, keeps working. */
  .struct-body { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .diagram-box { position: absolute; inset: 0; overflow: hidden; }
  .diagram {
    display: block; width: 100%; height: 100%;
    touch-action: none; user-select: none; cursor: grab;
  }
  .diagram.panning { cursor: grabbing; }
  .diagram path.edge { stroke: #9aa0aa; stroke-width: 1.6; fill: none; transition: opacity .18s, stroke .18s; }
  .diagram path.edge.hl { stroke: var(--accent); stroke-width: 2.6; }
  /* Chrome clips a foreignObject to its box, so each one is NODE_PAD bigger than the element on
     every side and the element wears that as margin - otherwise the focus ring, which is an
     outer box-shadow, gets cut off. Hits belong to the element, not to the padding around it. */
  .diagram foreignObject { pointer-events: none; }
  .diag-node {
    margin: 8px; width: 160px; text-align: center; font-size: 11.5px; line-height: 1.2;
    border-radius: 12px; padding: 6px 9px; border: 3px solid transparent; background: #fff;
    cursor: pointer; pointer-events: auto; box-shadow: 0 1px 2px rgba(0,0,0,.05);
    transition: opacity .18s, filter .18s;
  }
  .diag-node:hover { box-shadow: 0 0 0 3px rgba(59,91,219,.18); }
  .diag-node.hl { box-shadow: 0 0 0 4px rgba(59,91,219,.45); }
  .diag-node .ntag { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-top: 3px; }
  .diag-node .nicon { color: var(--muted); margin-right: 4px; font-weight: 600; }
  .edge-label {
    /* max-content rather than an inline width: restyling for the border mode rewrites the whole
       style attribute, and a width written there wouldn't survive it */
    margin: 8px; width: max-content;
    /* stadium: the playground's shape for an edge drawn as a box, which is what says the box is
       an edge rather than a node */
    font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: #fff;
    border: 2px solid transparent; white-space: nowrap; cursor: pointer; pointer-events: auto;
    box-shadow: 0 1px 1px rgba(0,0,0,.05); transition: opacity .18s;
  }
  .edge-label:hover { box-shadow: 0 0 0 2px rgba(59,91,219,.15); }
  .edge-label.hl { box-shadow: 0 0 0 4px rgba(59,91,219,.45); }

  /* Off-screen box that sizes a node or label before dagre can place it. visibility rather than
     display, which would measure zero. */
  .diagram-measure { position: absolute; left: -9999px; top: 0; visibility: hidden; width: max-content; }

  /* Diagram filters — what's on screen, opposite the zoom controls diagonally */
  .diagram-filters {
    position: absolute; left: 14px; top: 14px; z-index: 8;
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(255,255,255,.97); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 7px 10px; box-shadow: 0 2px 12px rgba(0,0,0,.10);
  }
  .filter-check {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #3d4149; cursor: pointer; white-space: nowrap;
  }
  .filter-check:hover { color: var(--text); }
  .filter-check input { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .filter-count { color: var(--muted); font-size: 11px; margin-left: auto; padding-left: 8px; }

  /* Zoom controls — mirrors the Color key across the pane, and the playground's diagram pane */
  .zoom-controls {
    position: absolute; right: 14px; bottom: 14px; z-index: 8;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoom-btn {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.97); border: 1px solid var(--line-strong);
    box-shadow: 0 2px 12px rgba(0,0,0,.10);
    color: var(--muted); font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
  }
  .zoom-btn:hover { border-color: var(--accent); color: var(--text); }
  .zoom-btn svg { width: 15px; height: 15px; }

  /* Focus mode — fade the unrelated, emphasise the selection's neighbours */
  .diagram.focus-mode .diag-node.faded { opacity: .17; filter: saturate(.35); }
  .diagram.focus-mode .edge-label.faded { opacity: .12; }
  .diagram.focus-mode path.edge.faded { opacity: .12; }
  .diagram.focus-mode path.edge.incident { stroke: #5b616b; stroke-width: 2.2; }

  /* Color key / legend */
  .legend {
    position: absolute; left: 14px; bottom: 14px; z-index: 8;
    background: rgba(255,255,255,.97); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 8px 11px 10px; box-shadow: 0 2px 12px rgba(0,0,0,.10);
    font-size: 11.5px; max-width: 252px;
  }
  .legend-title {
    display: block; width: 100%; text-align: left; background: none; border: none; padding: 0;
    font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    cursor: pointer; margin-bottom: 6px;
  }
  .legend.collapsed .legend-body { display: none; }
  .legend.collapsed .legend-title { margin-bottom: 0; }
  .legend-group { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin: 4px 0 3px; }
  .legend-group:first-child { margin-top: 0; }
  /* border-color mode lives here rather than in an app-bar gear: it's the setting the Color
     key exists to explain, and it sits next to the diagram it changes */
  .legend-modes { display: flex; gap: 4px; margin-bottom: 6px; }
  .legend-mode {
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 2px 8px; font: inherit; font-size: 10.5px; cursor: pointer;
  }
  .legend-mode:hover { border-color: var(--accent); }
  .legend-mode.active { background: #23262b; color: #fff; border-color: #23262b; }
  .legend-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; color: #3d4149; }
  .legend .sw { width: 18px; height: 12px; border-radius: 3px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,.10); }

  /* Claim-inspector popup */
  .claim-pop {
    position: absolute; z-index: 20; width: 272px;
    background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.20);
    padding: 12px 13px 13px; font-size: 12px; max-height: 82%; overflow: auto;
  }
  .claim-pop { transform: translateY(-50%); }
  /* A pan moves the node it points at every frame; re-measuring that per frame is the expensive
     way, so it goes invisible for the gesture and comes back where the node landed. */
  .claim-pop.settling { visibility: hidden; }
  .claim-pop .cp-close {
    position: absolute; top: 6px; right: 8px; border: none; background: none;
    color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px;
  }
  .claim-pop .cp-close:hover { color: var(--text); }
  .cp-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 5px; padding-right: 16px; }
  .cp-claim {
    display: inline-block; border-radius: 8px; padding: 4px 9px; font-size: 12.5px;
    line-height: 1.3; border: 2px solid transparent; font-style: italic;
  }
  .cp-claim b { font-style: normal; }
  .cp-section { margin-top: 12px; }
  .cp-section > .cp-label { margin-bottom: 6px; }
  .cp-scores { display: flex; flex-direction: column; gap: 4px; }
  .cp-score-row { display: flex; align-items: center; gap: 8px; }
  .cp-score-row .who { width: 46px; color: #3d4149; }
  .cp-chip { min-width: 30px; text-align: center; border-radius: 6px; padding: 1px 6px; font-size: 11.5px; }
  .cp-avg { margin-top: 6px; color: var(--muted); font-size: 11px; }
  .cp-args { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .cp-col h5 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .cp-col.pro h5 { color: #1b4fa8; }
  .cp-col.con h5 { color: #b2182b; }
  .cp-arg { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .cp-arg:last-child { margin-bottom: 0; }
  /* a popup column is 120px wide, so its edge boxes wrap rather than sitting on one line */
  .cp-arg .edge-phrase { font-size: 11px; padding: 3px 9px; border-radius: 12px; }
  .cp-none { color: var(--muted); font-size: 11px; }
  .cp-note { margin-top: 10px; color: var(--muted); font-size: 11px; line-height: 1.45; }

  /* Question view panels (replace diagram when a guiding question is selected) */
  .qview-scroll { position: absolute; inset: 0; overflow: auto; padding: 16px; }
  .qview { max-width: 860px; margin: 0 auto; }
  .qview h3 { font-size: 15px; margin: 0 0 4px; }
  .qview .sub { color: var(--muted); margin: 0 0 16px; font-size: 12.5px; }
  .pros { display: flex; flex-direction: column; gap: 12px; }
  .pro-card {
    display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; flex-wrap: wrap;
  }
  .pro-card .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .pro-card .badge.pro { background: #e7f0ff; color: #1b4fa8; }
  .pro-card .badge.con { background: #fdecea; color: #b2182b; }

  /* pros | cons two-column layout (for "why might we want ...") */
  .pros-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pc-head { margin: 0 0 10px; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .pc-head.pro { color: #1b4fa8; }
  .pc-head.con { color: #b2182b; }
  .pc-head .dir { font-size: 15px; }

  /* mini causes diagram (for "why do people immigrate illegally?") */
  .mini-diagram {
    position: relative; width: 100%; max-width: 820px; margin: 4px auto 0; aspect-ratio: 1000 / 430;
  }
  .mini-diagram svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .mini-diagram svg path { fill: none; stroke-width: 2; }
  .mini-node {
    position: absolute; transform: translate(-50%, -50%);
    width: 138px; text-align: center; font-size: 11px; line-height: 1.2;
    border-radius: 11px; padding: 6px 8px; border: 3px solid transparent; background: #fff;
    cursor: pointer; z-index: 2; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }

      <ol>
        <li><b>The minimap is derived.</b> It was eight ids in an array drawn as one flat ring &mdash; a pie chart of a list someone picked. It is now every causal node the topic can reach, ringed by how many steps out it sits, with each wedge as wide as the share of the map hanging off it. <i>Illegal immigration</i> takes three quarters of the circle, which is what this topic is.</li>

        <li><b>Hovering a segment shows the node's popup beside it</b>, and clicking still tries to select the node in the diagram.</li>
        <li><b>An edge outside the diagram is one box.</b> A Highlights row used to be two bordered pills with a word between them, so three colored things competed for what the row's flame meant. It is now a single stadium box bordered by the edge's own score, with the relation word bold &mdash; the shape the diagram gives an edge, and what the Summary paragraph already did.</li>

/* ============================================================
   ADAPTER - the bundle under the names the rendering already reads.
   ============================================================ */
const SCORERS = DATA.perspectives;
const TOPIC_ID = DATA.topic.id;
const TOPIC_DESC = DATA.topic.description;

const NODES = {};
for (const [id, node] of Object.entries(DATA.nodes)) {
  NODES[id] = {
    label: node.label,
    kind: node.kind,
    // a written #tag and a subtype an edge implies read the same on a pill
    tag: [...node.tags, ...node.subtypes].join(" \u00b7 ") || undefined,
    subtypes: node.subtypes,
    scores: node.scores,
    hotness: node.hotness,
  };
}

/* Keyed like DATA.edges, plus the id, so an edge can be passed around by id the way a node is. */
const EDGES = {};
for (const [id, edge] of Object.entries(DATA.edges)) EDGES[id] = { id, ...edge };

/* A criterion's importance is the score on its `criterion for` edge. Borrowing it onto the node is
   the view's call - the ontology deliberately keeps the score on the edge. */
for (const edge of Object.values(DATA.edges)) {
  if (edge.relation !== "criterion for") continue;
  if (NODES[edge.from].scores === null) NODES[edge.from].scores = edge.scores;
}

const QUESTIONS = DATA.questions.map(q => ({
  id: q.id,
  guides: q.guidingScore,
  ...OVERRIDES.questions[q.id],
}));

function isQuestionNode(id){ return NODES[id].kind === "guiding" || NODES[id].kind === "clarifying"; }

/* A highlight names what it points at and which signals listed it; DATA.nodes / DATA.edges say
   the rest. A question row has its own shape, so it's a third kind here even though DATA knows
   only two. */
const HOTTEST = DATA.highlights.map(item => ({
  ...item,
  ...(item.kind === "edge" ? EDGES[item.id] : { scores: NODES[item.id].scores }),
  kind: item.kind === "node" && isQuestionNode(item.id) ? "question" : item.kind,
}));

/* ============================================================
   DIAGRAM SET - which nodes and edges are on screen.
   Derived from the bundle's hotness rather than authored, behind two independent filters.
   ============================================================ */
const TOP_N = 10;
let filterHottest = true;
let filterCausal = true;

/* By node kind rather than by edge type: a concept nobody has connected yet still belongs on the
   map. Criteria and categories are the framing layer rather than the causal one, so they go with
   the claims. */
const FRAMING_SUBTYPES = ["criterion", "category"];
function isCausalNode(id){
  const node = NODES[id];
  return node.kind === "concept" && !node.subtypes.some(s => FRAMING_SUBTYPES.includes(s));
}

/* An implied claim stands behind a score rather than holding one, so an edge naming one is really
   naming the node or edge it stands behind. Both of those are boxes, so nothing draws the implied
   claim itself - the arrow lands on the box that owns the score. */
const IMPLIED_SUFFIX = "--implied";
function referentOf(id){
  return id.endsWith(IMPLIED_SUFFIX) ? id.slice(0, -IMPLIED_SUFFIX.length) : id;
}

/* The relations a claim or question attaches through. */
const ATTACH_RELATIONS = ["supports", "critiques", "answers", "clarifies", "mentions"];

/* Every edge with both ends on screen. A target can be another edge, which is itself only on
   screen once its own ends are, so this loops until it stops finding new ones. */
function edgesAmong(shown){
  const drawn = new Map();
  for (let more = true; more; ) {
    more = false;
    for (const edge of Object.values(EDGES)) {
      if (drawn.has(edge.id) || !shown.has(edge.from)) continue;
      const target = referentOf(edge.to);
      if (!shown.has(target) && !drawn.has(target)) continue;
      drawn.set(edge.id, edge);
      more = true;
    }
  }
  return [...drawn.values()];
}

/* Hotness scores a claim and the thing it argues about independently, so a hot claim can arrive
   with its referent nowhere on screen, where it says nothing. Each one gets one hop toward that
   referent, and only when nothing already anchors it. */
function anchorInto(shown){
  const queue = [...shown];
  while (queue.length > 0) {
    const id = queue.shift();
    if (NODES[id].kind === "concept") continue;
    const attaches = Object.values(EDGES)
      .filter(edge => edge.from === id && ATTACH_RELATIONS.includes(edge.relation));
    if (attaches.length === 0 || attaches.some(edge => isAnchored(edge.to, shown))) continue;
    for (const id of endpointsOf(referentOf(attaches[0].to))) {
      if (shown.has(id)) continue;
      shown.add(id);
      queue.push(id);
    }
  }
}

function isAnchored(target, shown){
  return endpointsOf(referentOf(target)).every(id => shown.has(id));
}

/* The nodes a referent needs on screen before it can be drawn: an edge needs both of its ends. */
function endpointsOf(id){
  const edge = EDGES[id];
  return edge ? [edge.from, ...endpointsOf(referentOf(edge.to))] : [id];
}

function diagramSet(){
  let ids = Object.keys(NODES).toSorted((a, b) => NODES[b].hotness - NODES[a].hotness);
  if (filterHottest) ids = ids.slice(0, TOP_N);
  // "the hottest ten, of those the causal ones" rather than "the ten hottest causal ones", so
  // that unchecking a box only ever adds boxes
  if (filterCausal) ids = ids.filter(isCausalNode);
  const shown = new Set(ids);
  // a causal-only view holds no claims or questions, so nothing needs anchoring
  if (!filterCausal) anchorInto(shown);
  return {
    // hotness order is dagre's tiebreak when crossing minimization leaves a rank's order open
    nodeIds: [...shown].toSorted((a, b) => NODES[b].hotness - NODES[a].hotness),
    edges: edgesAmong(shown),
  };
}

let VISIBLE_NODES = [];
let VISIBLE_EDGES = [];
function isVisible(id){ return VISIBLE_NODES.includes(id) || VISIBLE_EDGES.some(e => e.id === id); }
function findEdge(from, to){
  return Object.values(EDGES).find(e => e.from === from && referentOf(e.to) === to);
}

/* ============================================================
   COLOR HELPERS — colorblind-safe RdBu diverging + purple for guides.
   ============================================================ */
const RB = { neg: "#b2182b", mid: "#e9e9e9", pos: "#2166ac" }; // red .. gray .. blue
const PURPLE = { lo: "#e6dcf0", hi: "#6a3d9a" };

function hex2rgb(h){ h = h.replace("#",""); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgb2hex(a){ return "#" + a.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join(""); }
function mix(c1, c2, t){ const a = hex2rgb(c1), b = hex2rgb(c2); return rgb2hex(a.map((v,i) => v + (b[i]-v)*t)); }

// change-importance / edge weight: -8..8 -> red..gray..blue
function colorRB(s){ if (s < 0) return mix(RB.neg, RB.mid, (s+8)/8); return mix(RB.mid, RB.pos, s/8); }
// guides weight: 0..8 -> light..deep purple
function colorPurple(s){ return mix(PURPLE.lo, PURPLE.hi, Math.max(0,s)/8); }
function colorFor(s, palette){ return palette === "purple" ? colorPurple(s) : colorRB(s); }
function tint(c){ return mix(c, "#ffffff", 0.82); }

/* How a border reads a set of scorers. "average" merges them into one color and is the
   default, because side-by-side hues on every element read as noise to someone arriving;
   "disagreement" bands them, which is what you want when hunting contested claims. */
let borderMode = "average";

/* Build inline style for a pill/node/edge-label from its scores.
   Fill is always a light tint of the average. In disagreement mode the border is equal-width
   HARD-STOP bands, one per scorer sorted by score, so consensus reads near-solid and a split
   reads as distinct side-by-side blocks; the padding-box/border-box background trick keeps
   that banding while respecting border-radius. */
function pillStyle(scores, palette, borderPx){
  borderPx = borderPx || 2;
  if (!scores || scores.every(s => s === null)) {
    return `background:#fff; border:${borderPx}px solid #c4c4c4;`;
  }
  const present = scores.filter(s => s !== null).sort((a,b) => a - b);
  const n = present.length;
  const avg = present.reduce((a,s) => a+s, 0) / n;
  const fill = tint(colorFor(avg, palette));
  if (borderMode === "average") {
    return `background:${fill}; border:${borderPx}px solid ${colorFor(avg, palette)};`;
  }
  const stops = present.map((s,i) => {
    const c = colorFor(s, palette);
    return `${c} ${(i/n*100).toFixed(2)}% ${((i+1)/n*100).toFixed(2)}%`;
  }).join(", ");
  // angled hard bands rather than horizontal, so a split stays legible on a one-line pill
  const grad = `linear-gradient(120deg, ${stops})`;
  return `background:linear-gradient(${fill},${fill}) padding-box, ${grad} border-box;`
       + `border:${borderPx}px solid transparent;`;
}

/* mean of a scores array, ignoring nulls (0 if all null) */
function avgScore(scores){
  if (!scores) return 0;
  const p = scores.filter(s => s !== null);
  return p.length ? p.reduce((a,s) => a+s, 0) / p.length : 0;
}
/* signed score label: +2 / −8 / 0 / — */
function fmtScore(s){ return (s === null || s === undefined) ? "—" : (s > 0 ? "+" + s : (s < 0 ? "−" + Math.abs(s) : "0")); }

/* Effect-on-target scores for an edge: causes keeps its sign; reduces/impedes flip
   (a "reduce" is a negative effect). This makes causes read blue, reduces/impedes read
   red — colored by what the edge does to its target rather than by belief in the verb. */
function effectScores(relation, scores){
  const flip = (relation === "reduces" || relation === "impedes");
  return (scores || []).map(s => s === null ? null : (flip ? -s : s));
}

/* ============================================================
   PILL / NODE FACTORIES
   ============================================================ */
function makeNodePill(id, opts){
  opts = opts || {};
  const node = NODES[id];
  const el = document.createElement(opts.inline ? "span" : "button");
  el.className = "pill" + (opts.inline ? " inline" : "");
  el.setAttribute("style", pillStyle(node.scores, "rb", 2));
  el.dataset.node = id;
  // the diagram's marker, so a claim or question reads the same wherever it appears
  el.innerHTML = KIND_ICONS[node.kind] ? `<span class="nicon">${KIND_ICONS[node.kind]}</span>` : "";
  el.appendChild(document.createTextNode(node.label));
  if (opts.tag && node.tag) {
    const t = document.createElement("span"); t.className = "tag"; t.textContent = node.tag; el.appendChild(t);
  }
  if (opts.static) {
    // used for pills embedded in a guiding-question row: let clicks bubble up to select the row
    el.style.cursor = "inherit";
  } else {
    el.addEventListener("click", (e) => { e.stopPropagation(); onNodeActivate(id); });
  }
  return el;
}

/* An edge outside the diagram is one box rather than a bordered pill on each end: the row is about
   the edge's score, and three separately colored things left it unclear which one carried the
   flame. Stadium and effect coloring are what the diagram gives an edge; the Summary paragraph's
   edge refs have read this way since v4.
   `source` off drops the "from" label, for a list already grouped under that node. */
function makeEdgePhrase(id, opts){
  opts = opts || {};
  const edge = EDGES[id];
  const el = document.createElement("span");
  el.className = "edge-phrase";
  el.setAttribute("style", pillStyle(effectScores(edge.relation, edge.scores), "rb", 2));
  el.dataset.edge = id;
  if (opts.source !== false) el.appendChild(document.createTextNode(labelOf(edge.from) + " "));
  const relation = document.createElement("b");
  relation.textContent = edge.relation;
  el.appendChild(relation);
  el.appendChild(document.createTextNode(" " + labelOf(referentOf(edge.to))));
  el.addEventListener("click", (e) => { e.stopPropagation(); onEdgeActivate(id); });
  return el;
}

/* ============================================================
   RENDER: STRUCTURE DIAGRAM (bottom-to-top layered)
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
/* foreignObject overhang, in graph px - see the .diagram foreignObject rule */
const NODE_PAD = 8;
let POS = {};   // id -> { x, y, w, h } - center and visual size, in graph px
let panZoom = null;

/* A box's size is whatever the browser makes of its text, and dagre needs that number before it
   can place anything, so each element is built and measured off-screen first. */
function measure(el){
  const box = document.getElementById("diagramMeasure");
  box.appendChild(el);
  const size = { width: el.offsetWidth, height: el.offsetHeight };
  box.removeChild(el);
  return size;
}

/* The syntax's own markers, so a box reads the way the line that wrote it does (`ontology.md` ->
   Syntax legend). A concept gets none, which is what makes an icon mean "not cause and effect". */
const KIND_ICONS = { guiding: "?", clarifying: "?", claim: "=", source: "\u{1F4C4}" };

function makeDiagramNode(id){
  const node = NODES[id];
  const el = document.createElement("div");
  el.className = "diag-node";
  el.dataset.node = id;
  el.setAttribute("style", pillStyle(node.scores, "rb", 3));
  const icon = KIND_ICONS[node.kind];
  el.innerHTML = (icon ? `<span class="nicon">${icon}</span>` : "") + node.label
    + (node.tag ? `<span class="ntag">${node.tag}</span>` : "");
  return el;
}

/* An edge is a box dagre places, which is what lets an arrow land on it. The playground's arg-map
   ontology calls the same move "implied" rendering and owns the reasoning, in its rendering.md. */
function makeEdgeBox(edge){
  const el = document.createElement("div");
  el.className = "edge-label";
  // v4: color by effect on target (causes blue, reduces/impedes red)
  el.setAttribute("style", pillStyle(effectScores(edge.relation, edge.scores), "rb", 2));
  el.dataset.edge = edge.id;
  el.textContent = edge.relation;
  return el;
}

function placeInForeignObject(el, size, cx, cy){
  const fo = document.createElementNS(SVGNS, "foreignObject");
  fo.setAttribute("x", cx - size.width / 2 - NODE_PAD);
  fo.setAttribute("y", cy - size.height / 2 - NODE_PAD);
  fo.setAttribute("width", size.width + NODE_PAD * 2);
  fo.setAttribute("height", size.height + NODE_PAD * 2);
  fo.appendChild(el);
  return fo;
}

function renderDiagram(){
  // svg-pan-zoom folds the viewBox into a transform of its own at setup, so a new viewBox only
  // takes effect on a fresh instance. Re-fitting is right anyway once the picture has changed.
  if (panZoom) { panZoom.destroy(); panZoom = null; }
  const viewport = document.getElementById("diagramViewport");
  viewport.replaceChildren();

  const view = diagramSet();
  VISIBLE_NODES = view.nodeIds;
  VISIBLE_EDGES = view.edges;

  const els = {}, sizes = {};
  const measured = (id, el) => { els[id] = el; sizes[id] = measure(el); };
  VISIBLE_NODES.forEach(id => measured(id, makeDiagramNode(id)));
  VISIBLE_EDGES.forEach(edge => measured(edge.id, makeEdgeBox(edge)));

  const g = new dagre.graphlib.Graph();
  // ranksep is halved to pay for the edge boxes: each relationship spans two dagre edges, and
  // dagre's makeSpaceForEdgeLabels doubles every edge's minlen on top of that.
  g.setGraph({ rankdir: "BT", nodesep: 30, ranksep: 29, edgesep: 16, marginx: 28, marginy: 28 });
  g.setDefaultEdgeLabel(() => ({}));
  Object.keys(sizes).forEach(id => g.setNode(id, sizes[id]));
  // One relationship, two connectors: `source -> edge box -> target`. No two can collide, since
  // one end of each is the ontology edge's own id.
  VISIBLE_EDGES.forEach(edge => {
    g.setEdge(edge.from, edge.id, {});
    g.setEdge(edge.id, referentOf(edge.to), {});
  });
  dagre.layout(g);

  // svg-pan-zoom folds this into its own transform and then drops the attribute, so it reads as
  // dead - it isn't. fit() measures the viewBox when there is one and the content's bbox when
  // there isn't, and only the viewBox carries dagre's margins, which is the breathing room
  // around a fitted diagram.
  const size = g.graph();
  document.getElementById("diagram").setAttribute("viewBox", `0 0 ${size.width} ${size.height}`);

  POS = {};
  Object.keys(sizes).forEach(id => {
    const n = g.node(id);
    POS[id] = { x: n.x, y: n.y, w: sizes[id].width, h: sizes[id].height };
  });

  // document order is paint order in SVG: lines under the boxes they end on
  VISIBLE_EDGES.forEach(edge => {
    const target = referentOf(edge.to);
    viewport.appendChild(halfPath(g.edge(edge.from, edge.id), edge.from, edge.id, edge.id, "in"));
    viewport.appendChild(halfPath(g.edge(edge.id, target), edge.id, target, edge.id, "out"));
  });
  Object.keys(sizes).forEach(id => {
    viewport.appendChild(placeInForeignObject(els[id], sizes[id], POS[id].x, POS[id].y));
  });

  document.getElementById("filterCount").textContent =
    `${VISIBLE_NODES.length} of ${Object.keys(NODES).length}`;

  initPanZoom();
  if (focusState) applyFocus();
}

/* Only the outgoing half carries the arrowhead, so the pair reads as one line through a pill
   rather than as two relationships. */
function halfPath(dagreEdge, from, to, edgeId, half){
  const path = document.createElementNS(SVGNS, "path");
  path.setAttribute("class", "edge");
  path.setAttribute("d", edgePath(dagreEdge.points, from, to));
  if (half === "out") path.setAttribute("marker-end", "url(#arrow)");
  path.dataset.edge = edgeId;
  path.dataset.half = half;
  return path;
}

/* Border mode only changes colors, so the picture is repainted rather than laid out again -
   which also leaves the current pan and zoom where the reader put them. */
function restyleDiagram(){
  VISIBLE_NODES.forEach(id => {
    const el = document.querySelector(`.diag-node[data-node="${id}"]`);
    if (el) el.setAttribute("style", pillStyle(NODES[id].scores, "rb", 3));
  });
  VISIBLE_EDGES.forEach(edge => {
    const el = document.querySelector(`.edge-label[data-edge="${edge.id}"]`);
    if (el) el.setAttribute("style", pillStyle(effectScores(edge.relation, edge.scores), "rb", 2));
  });
}

// Boundary point of the target node's rect in the direction of (cx,cy)
function trimToRect(cx, cy, tx, ty, hw, hh){
  const dx = cx - tx, dy = cy - ty;
  if (dx === 0 && dy === 0) return { x: tx, y: ty };
  const sx = dx !== 0 ? hw / Math.abs(dx) : Infinity;
  const sy = dy !== 0 ? hh / Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: tx + dx * s, y: ty + dy * s };
}

/* dagre's endpoints sit on the rank boundary rather than on the box, so both ends are
   re-intersected against the node's own rectangle the way dagre-d3 does it. */
function edgePath(points, from, to){
  const a = POS[from], b = POS[to];
  const first = trimToRect(points[1].x, points[1].y, a.x, a.y, a.w / 2 + 3, a.h / 2 + 3);
  const last = trimToRect(points[points.length - 2].x, points[points.length - 2].y,
                          b.x, b.y, b.w / 2 + 5, b.h / 2 + 5);
  return curveThrough([first, ...points.slice(1, -1), last]);
}

/* A cubic B-spline over dagre's points, written as Beziers - the curve mermaid draws, and the
   reason its edges read as one bend rather than a run of segments.

   It approximates the points instead of passing through them, which is the point: dagre's middle
   point is a label slot rather than a routing bend, and it often sits straight above the source,
   so a curve forced through it has to leave at a right angle and bow outward to come back. A
   B-spline stays inside the hull of its points, so it cuts that corner and never bows out.
   The ends are tripled, which pins the curve to the node borders where the arrowheads land. */
function curveThrough(pts){
  if (pts.length < 3) return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;
  const c = [pts[0], pts[0], ...pts, pts[pts.length - 1], pts[pts.length - 1]];
  let d = `M ${(c[0].x + 4 * c[1].x + c[2].x) / 6} ${(c[0].y + 4 * c[1].y + c[2].y) / 6}`;
  for (let i = 1; i < c.length - 2; i++) {
    const a = c[i], b = c[i + 1], next = c[i + 2];
    d += ` C ${(2 * a.x + b.x) / 3} ${(2 * a.y + b.y) / 3}`
       + ` ${(a.x + 2 * b.x) / 3} ${(a.y + 2 * b.y) / 3}`
       + ` ${(a.x + 4 * b.x + next.x) / 6} ${(a.y + 4 * b.y + next.y) / 6}`;
  }
  return d;
}

/* ============================================================
   DIAGRAM PAN / ZOOM
   ============================================================ */
function initPanZoom(){
  panZoom = svgPanZoom(document.getElementById("diagram"), {
    viewportSelector: "#diagramViewport",
    zoomEnabled: true, controlIconsEnabled: false, dblClickZoomEnabled: false,
    fit: true, center: true, minZoom: 0.2, maxZoom: 20,
    // uniwheel binds to the SVG itself, so the wheel only zooms while the pointer is over the
    // diagram and keeps scrolling everything else on the page
    mouseWheelZoomEnabled: true,
    onPan: settlePopup, onZoom: settlePopup,
  });
}

/* Pan vs tap: svg-pan-zoom preventDefaults mousedown and touchstart, so clicks are recognized
   here by how far the pointer travelled rather than left to a click event on the node. */
const TAP_SLOP = 6;
let pressedAt = null;
let pannedSinceDown = false;

function initDiagramPointer(){
  const svg = document.getElementById("diagram");
  svg.addEventListener("pointerdown", (e) => {
    pressedAt = e.button === 0 ? { x: e.clientX, y: e.clientY } : null;
    pannedSinceDown = false;
    if (pressedAt) svg.classList.add("panning");
  });
  svg.addEventListener("pointerup", (e) => {
    const from = pressedAt;
    pressedAt = null;
    svg.classList.remove("panning");
    if (!from) return;
    if (Math.hypot(e.clientX - from.x, e.clientY - from.y) > TAP_SLOP) { pannedSinceDown = true; return; }
    const node = e.target.closest(".diag-node");
    if (node) { onNodeActivate(node.dataset.node); return; }
    const box = e.target.closest(".edge-label");
    if (box) onEdgeActivate(box.dataset.edge);
  });
  svg.addEventListener("pointercancel", () => { pressedAt = null; svg.classList.remove("panning"); });

  // the minimap fades what the diagram isn't drawing, so a filter change repaints it too
  const refilter = () => {
    clearHighlight();
    renderDiagram();
    if (summaryMode === "sunburst" && !selectedQuestion) renderSummary();
  };
  document.getElementById("filterHottestBox").addEventListener("change", (e) => {
    filterHottest = e.target.checked;
    refilter();
  });
  document.getElementById("filterCausalBox").addEventListener("change", (e) => {
    filterCausal = e.target.checked;
    refilter();
  });

  document.getElementById("zoomIn").addEventListener("click", () => panZoom && panZoom.zoomBy(1.2));
  document.getElementById("zoomOut").addEventListener("click", () => panZoom && panZoom.zoomBy(0.8));
  document.getElementById("zoomFit").addEventListener("click", () => {
    if (!panZoom) return;
    panZoom.fit(); panZoom.center();
  });

  // svg-pan-zoom measures the SVG once and caches it, so without this every later fit() would
  // scale to the pane's size at load rather than its size now. Re-measuring leaves the current
  // pan/zoom alone; it only refreshes what "fit" means.
  new ResizeObserver(() => {
    const box = document.getElementById("diagramBox");
    // a zero-size measurement (question view showing) would cache a garbage scale
    if (!box.clientWidth || !box.clientHeight) return;
    if (panZoom) panZoom.resize();
  }).observe(document.getElementById("diagramBox"));
}

/* ============================================================
   RENDER: MINIMAP - the whole causal map, as a sunburst
   Every causal node the topic can reach: a ring is a step out from the topic, a wedge is as wide
   as the share of the map hanging off it, and what the diagram isn't drawing is faded. Reasoning
   and the alternatives in ai-designs/derived-minimap.md.
   ============================================================ */
const MINIMAP = { size: 264, hole: 40, gap: 0.016 };

/* Undirected adjacency over the causal nodes, each link keeping the relation and which way it runs
   so a boundary glyph can say both. */
function causalLinks(){
  const links = {};
  Object.keys(NODES).filter(isCausalNode).forEach(id => links[id] = []);
  Object.values(EDGES).forEach(edge => {
    const to = referentOf(edge.to);
    if (!links[edge.from] || !links[to]) return;
    links[edge.from].push({ edge: edge.id, to, relation: edge.relation, outward: true });
    links[to].push({ edge: edge.id, to: edge.from, relation: edge.relation, outward: false });
  });
  return links;
}

/* A sunburst wants a tree and the causal map is a graph, so a node with two routes to the topic is
   drawn under each parent - which is the only way the second route's edge gets drawn at all. Only
   a node's first instance expands: re-expanding repeats whole arms, and skipping a link whose edge
   is already drawn puts every edge on screen exactly once regardless.
   A causal node the topic can't reach is left out rather than parked against the center, where it
   would read as a relation to the topic that nobody stated. */
function minimapTree(){
  const links = causalLinks();
  const order = Object.keys(NODES);
  const root = { id: TOPIC_ID, ring: 0, kids: [] };
  const drawn = new Set(), expanded = new Set([TOPIC_ID]);
  for (const queue = [root]; queue.length > 0; ) {
    const instance = queue.shift();
    const next = links[instance.id]
      .filter(link => !drawn.has(link.edge))
      .toSorted((a, b) => order.indexOf(a.to) - order.indexOf(b.to));
    for (const link of next) {
      drawn.add(link.edge);
      const kid = { id: link.to, ring: instance.ring + 1, link, kids: [] };
      instance.kids.push(kid);
      if (expanded.has(link.to)) continue;
      expanded.add(link.to);
      queue.push(kid);
    }
  }
  return { root, unreached: Object.keys(links).filter(id => !expanded.has(id)).length };
}

/* Leaf-equal angles: every leaf takes the same share and a parent spans its children, so a wedge's
   width is how much of the map hangs off it. */
function minimapSegments(root){
  const leaves = node => node.kids.length ? node.kids.reduce((n, kid) => n + leaves(kid), 0) : 1;
  const total = leaves(root);
  const segments = [];
  const place = (node, from, to) => {
    if (node.ring > 0) segments.push({ id: node.id, ring: node.ring, link: node.link, from, to });
    let at = from;
    node.kids.forEach(kid => {
      const width = leaves(kid) / total * Math.PI * 2;
      place(kid, at, at + width);
      at += width;
    });
  };
  place(root, 0, Math.PI * 2);
  return segments;
}

/* pillStyle's disagreement banding as a paint an arc can take: the same hard stops at the same
   angle. Average mode is one flat color, since an arc carries its score as fill rather than as the
   border a pill uses - there is no text on it to keep legible.
   Null when nothing is scored, so a caller can pick its own gray: an unscored fill and an unscored
   outline want different weights. */
function minimapPaint(scores, defs, key){
  const present = (scores || []).filter(s => s !== null).toSorted((a, b) => a - b);
  if (!present.length) return null;
  if (borderMode === "average") {
    return colorRB(present.reduce((a, s) => a + s, 0) / present.length);
  }
  const grad = document.createElementNS(SVGNS, "linearGradient");
  grad.id = `sb-band-${key}`;
  // the direction pillStyle's linear-gradient(120deg, ...) runs, in a box the arc's bbox defines
  grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0");
  grad.setAttribute("x2", ".87"); grad.setAttribute("y2", ".5");
  present.forEach((score, i) => {
    [i / present.length, (i + 1) / present.length].forEach(offset => {
      const stop = document.createElementNS(SVGNS, "stop");
      stop.setAttribute("offset", offset);
      stop.setAttribute("stop-color", colorRB(score));
      grad.appendChild(stop);
    });
  });
  defs.appendChild(grad);
  return `url(#${grad.id})`;
}

/* The arrow shapes ameliorate draws on its own edges, taken verbatim from its EdgeArrow.tsx
   (`arrowShapePaths`, plus the 1.25/1.125 scale its group carries): logic gates, whose silhouettes
   already carry the distinction. A buffer gate for causes, a NOT gate - triangle with the bubble at
   its tip - for reduces and impedes, an AND gate for has.
   Drawn centered at the origin pointing +x, so a glyph is turned along the radius by rotation
   alone, and a relation running inward is the same shape turned 180deg rather than a mirrored one. */
/* All three end at x=5, where ameliorate's NOT gate runs to 8.5 and its AND gate to 7: a gate there
   sits at the end of an edge with the rest of the diagram behind it, while here twelve of them ring
   a 264px circle, and an uneven reach reads as an uneven size. The NOT gate keeps the reference's
   proportions inside that reach - roughly three fifths triangle, a hair of gap, two fifths bubble -
   so it is the same gate drawn shorter, not a different one. */
const GLYPHS = {
  causes: { path: "M -5 -5 L 5 0 L -5 5 Z" },
  reduces: { path: "M -5 -5 L 0.8 0 L -5 5 Z", bubble: { cx: 3.1, r: 1.9 } },
  has: { path: "M -5 -5 L -5 5 Q 5 5, 5 0 Q 5 -5, -5 -5 Z" },
};
// of ameliorate's own 1.25/1.125, which is sized for an edge in a diagram rather than a 22px ring
const GLYPH_SCALE = 0.75;
/* Filled the color the edge's border takes in the diagram - ameliorate strokes these in the edge's
   color over a white fill, which is the same statement made on a white canvas rather than on a
   colored arc. Flat even in disagreement mode: three hard bands across 12px is noise, not a split. */
function relationGlyph(link, x, y, angle){
  const glyph = GLYPHS[link.relation === "impedes" ? "reduces" : link.relation];
  if (!glyph) return null;
  const group = document.createElementNS(SVGNS, "g");
  group.setAttribute("class", "sb-glyph");
  const scored = effectScores(link.relation, EDGES[link.edge].scores).filter(s => s !== null);
  // an unscored relation takes the gray the diagram's own arrowheads are drawn in
  group.setAttribute("fill", scored.length
    ? colorRB(scored.reduce((a, s) => a + s, 0) / scored.length)
    : "#9aa0aa");
  group.setAttribute("transform", `translate(${x} ${y})`
    + ` rotate(${angle * 180 / Math.PI + (link.outward ? 0 : 180)})`
    + ` scale(${1.25 * GLYPH_SCALE} ${1.125 * GLYPH_SCALE})`);
  const shape = document.createElementNS(SVGNS, "path");
  shape.setAttribute("d", glyph.path);
  group.appendChild(shape);
  if (glyph.bubble) {
    const bubble = document.createElementNS(SVGNS, "circle");
    bubble.setAttribute("cx", glyph.bubble.cx); bubble.setAttribute("cy", 0);
    bubble.setAttribute("r", glyph.bubble.r);
    group.appendChild(bubble);
  }
  return group;
}

/* What the diagram is drawing is filled, and what it isn't keeps the same color as an outline
   around nothing. Fading was the first try and it reads as a third score rather than as a state:
   a washed-out red and a genuine near-zero gray are the same picture. */
function paintSegment(el, id, paint){
  const shown = isVisible(id);
  el.setAttribute("class", "sb-seg" + (shown ? "" : " hollow"));
  el.setAttribute("fill", shown ? (paint || "#f0f0f0") : "#fff");
  el.setAttribute("stroke", shown ? "#fff" : (paint || "#c4c4c4"));
}

function buildSunburst(){
  const { root, unreached } = minimapTree();
  const segments = minimapSegments(root);
  const { size, hole, gap } = MINIMAP;
  const rings = Math.max(...segments.map(s => s.ring));
  const width = (size / 2 - hole - 2) / rings;
  const center = size / 2;
  const at = (r, angle) => [center + r * Math.cos(angle), center + r * Math.sin(angle)];

  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size);
  svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
  svg.setAttribute("class", "sunburst");
  const defs = document.createElementNS(SVGNS, "defs");
  svg.appendChild(defs);
  const glyphs = document.createElementNS(SVGNS, "g"); // above every arc, so a boundary can't clip one

  segments.forEach((segment, i) => {
    const inner = hole + (segment.ring - 1) * width, outer = inner + width;
    // -90deg so the first wedge starts at 12 o'clock, and a gap on each side for the white seam
    const a0 = segment.from - Math.PI / 2 + gap, a1 = segment.to - Math.PI / 2 - gap;
    const sweep = (a1 - a0) > Math.PI ? 1 : 0;
    const [x0, y0] = at(inner, a0), [x1, y1] = at(outer, a0);
    const [x2, y2] = at(outer, a1), [x3, y3] = at(inner, a1);
    const arc = document.createElementNS(SVGNS, "path");
    arc.setAttribute("d", `M ${x0} ${y0} L ${x1} ${y1} A ${outer} ${outer} 0 ${sweep} 1 ${x2} ${y2}`
      + ` L ${x3} ${y3} A ${inner} ${inner} 0 ${sweep} 0 ${x0} ${y0} Z`);
    paintSegment(arc, segment.id, minimapPaint(NODES[segment.id].scores, defs, i));
    arc.dataset.node = segment.id;
    bindMinimapSegment(arc, segment.id, at(inner + width / 2, (a0 + a1) / 2));
    svg.appendChild(arc);

    const glyph = relationGlyph(segment.link, ...at(inner, (a0 + a1) / 2), (a0 + a1) / 2);
    if (glyph) glyphs.appendChild(glyph);
  });

  const middle = document.createElementNS(SVGNS, "circle");
  middle.setAttribute("cx", center); middle.setAttribute("cy", center); middle.setAttribute("r", hole - 2);
  paintSegment(middle, TOPIC_ID, minimapPaint(NODES[TOPIC_ID].scores, defs, "topic"));
  middle.dataset.node = TOPIC_ID;
  bindMinimapSegment(middle, TOPIC_ID, [center, center]);
  svg.appendChild(middle);
  svg.appendChild(glyphs);

  const wrap = document.createElement("figure");
  wrap.className = "sunburst-wrap";
  const nodeCount = new Set(segments.map(s => s.id)).size + 1; // + the topic at the center
  const caption = document.createElement("figcaption");
  caption.innerHTML = `Every cause and effect in the topic &mdash; ${nodeCount} of them, ringed by`
    + ` steps out from &ldquo;${NODES[TOPIC_ID].label}&rdquo; at the center. Color is the group's score,`
    + ` and a glyph on a ring boundary is the relation crossing it.`
    + `<br><br>An outline with no fill is a node the diagram below isn't drawing. A node with two`
    + ` routes to the topic sits under each. Hover a segment for its details, click to select it`
    + ` in the diagram.`
    + (unreached ? `<br><br>${unreached} causal node${unreached > 1 ? "s aren't" : " isn't"} connected`
       + ` to the topic, so ${unreached > 1 ? "they have" : "it has"} no place on the map.` : "");
  wrap.appendChild(document.createElement("div")); // spacer, so the sunburst centers in the pane
  wrap.appendChild(svg);
  wrap.appendChild(caption);
  return wrap;
}

/* Hovering shows what selecting would, anchored to the segment: over half of these nodes aren't
   drawn in the diagram, so there is often no box to put the popup beside. */
function bindMinimapSegment(el, id, [x, y]){
  el.addEventListener("click", () => {
    previewing = false; // the selection owns the popup from here, wherever it decides to put it
    onNodeActivate(id);
  });
  el.addEventListener("mouseenter", () => {
    const svg = el.ownerSVGElement.getBoundingClientRect();
    previewNode(id, { left: svg.left + x, right: svg.left + x, top: svg.top + y, height: 0 });
  });
  el.addEventListener("mouseleave", endPreview);
}

let previewing = false;
function previewNode(id, rect){
  previewing = true;
  showClaimPopupForNode(id, rect);
}
function endPreview(){
  if (!previewing) return;
  previewing = false;
  hideClaimPopup();
  if (!focusState) return;
  if (EDGES[focusState]) showClaimPopupForEdge(focusState); else showClaimPopupForNode(focusState);
}

function buildTradeoffs(){
  const actions = ["wall", "more-admin", "fewer-requirements"];

  const cells = {

    quick:       { wall: null, "more-admin": null, "fewer-requirements": null },

  actions.forEach(a => hr.appendChild(cellTh(NODES[a].label)));
  thead.appendChild(hr); table.appendChild(thead);

  Object.keys(cells).forEach(crit => {

    const cs = NODES[crit].scores.filter(s => s !== null); const avg = cs.reduce((a,s)=>a+s,0)/cs.length;
    w.textContent = `importance ${avg.toFixed(1)}`;
    th.appendChild(w);
    tr.appendChild(th);
    actions.forEach(a => {

function cellTh(txt, cls){ const th = document.createElement("th"); if (cls) th.className = cls; th.textContent = txt; return th; }

/* ============================================================
   CALCULATED ARGUMENTS (ontology.md → "Calculated arguments")
   From a node's OUTGOING causal edges:
     pro  = causes a positive concept, or reduces/impedes a negative one
     con  = causes a negative concept, or reduces/impedes a positive one
   ============================================================ */
/* Reads the whole document rather than what the diagram shows: a concept's pros and cons are a
   fact about the topic, and a filter checkbox must not quietly change them. */
const CAUSAL_RELATIONS = ["causes", "reduces", "impedes"];
function calcArguments(id){
  const pros = [], cons = [];
  const outgoing = Object.values(EDGES)
    .filter(e => e.from === id && CAUSAL_RELATIONS.includes(e.relation));
  outgoing.forEach(e => {
    const tAvg = avgScore(NODES[e.to].scores);
    const decreases = (e.relation === "reduces" || e.relation === "impedes");
    const isPro = decreases ? (tAvg < 0) : (tAvg > 0);
    const strength = Math.abs(avgScore(e.scores)) * Math.abs(tAvg);
    (isPro ? pros : cons).push({ id: e.id, relation: e.relation, to: e.to, strength });
  });
  pros.sort((a,b) => b.strength - a.strength);
  cons.sort((a,b) => b.strength - a.strength);
  return { pros, cons };
}

/* An edge's target can be another edge, as in `how-enter clarifies (wall reduces illegal
   immigration)`, so an endpoint with no label of its own reads as its whole phrase. */
function labelOf(id){
  const edge = EDGES[id];
  return edge ? `${labelOf(edge.from)} ${edge.relation} ${labelOf(referentOf(edge.to))}` : NODES[id].label;
}
function cpLabel(parent, text){

function makePopupShell(){

const POPUP_W = 272; // matches .claim-pop's width, which JS has to know to place it on the left

/* The popup is chrome rather than diagram content, so it lives in the pane and anchors to where
   the node currently renders: it keeps its size while the diagram scales under it, and its gap
   to the node stays a real 12px at any zoom. */
let popupAnchor = null;
function positionPopupAtNode(pop, id, rect){
  const el = document.querySelector(`.diag-node[data-node="${id}"], .edge-label[data-edge="${id}"]`);
  if (!rect && !el) return;
  // a rect passed in is a minimap segment rather than a box in the diagram, and nothing moves it
  popupAnchor = rect ? null : id;
  const nr = rect || el.getBoundingClientRect();
  const br = document.getElementById("structPane").getBoundingClientRect();
  const gap = 12;
  const fitsRight = br.right - nr.right >= POPUP_W + gap * 2;
  pop.style.left = (fitsRight ? nr.right - br.left + gap : nr.left - br.left - gap - POPUP_W) + "px";
  pop.style.top = (nr.top + nr.height / 2 - br.top) + "px";
  if (!rect) return;
  // a selection pans the diagram until the popup is in view; a minimap segment has nothing to pan,
  // so the popup slides along the pane instead of hanging off its top
  const pr = pop.getBoundingClientRect();
  const over = Math.max(0, br.top + gap - pr.top) - Math.max(0, pr.bottom - (br.bottom - gap));
  pop.style.top = (nr.top + nr.height / 2 - br.top + over) + "px";
}
function hideClaimPopup(){
  const p = document.getElementById("claimPop");
  if (p) p.remove();
  popupAnchor = null;
}

/* Hide for the length of the gesture, then reappear beside wherever the node ended up. */
let popupSettleTimer = null;
function settlePopup(){
  const pop = document.getElementById("claimPop");
  if (!pop) return;
  pop.classList.add("settling");
  clearTimeout(popupSettleTimer);
  popupSettleTimer = setTimeout(() => {
    if (popupAnchor) positionPopupAtNode(pop, popupAnchor);
    pop.classList.remove("settling");
  }, 120);
}

/* Pan the diagram so the whole popup — and therefore the selected node beside it — is in view.
   The pane doesn't scroll any more, so what used to be a scrollBy is the same nudge applied to
   the diagram underneath instead. */
function ensurePopupVisible(pop){
  const body = document.getElementById("structBody");
  const pr = pop.getBoundingClientRect(), br = body.getBoundingClientRect();
  const pad = 14;
  let dx = 0, dy = 0;
  if (pr.right > br.right - pad) dx = pr.right - (br.right - pad);
  else if (pr.left < br.left + pad) dx = pr.left - (br.left + pad);
  if (pr.bottom > br.bottom - pad) dy = pr.bottom - (br.bottom - pad);
  else if (pr.top < br.top + pad) dy = pr.top - (br.top + pad);
  if ((dx || dy) && panZoom) panZoom.panBy({ x: -dx, y: -dy });
}

/* A concept's score is held by the implied claim behind it (`ontology.md` -> Implied claim
   wordings), while a claim's own score is its truth. */
function scoreClaimFor(id){
  const node = NODES[id];
  if (node.kind === "claim") return { label: "This claim's truth score", text: `“${node.label}”` };
  if (node.kind === "source") return { label: "A source holds no score", text: `“${node.label}”` };
  return { label: "Implied claim behind this concept's score",
           text: `“${node.label} is important to increase”` };
}

/* `rect` places the popup somewhere other than beside the node's box in the diagram - the minimap
   passes its segment, whose node is often not drawn at all. */
function showClaimPopupForNode(id, rect){
  hideClaimPopup();
  const node = NODES[id];
  const pop = makePopupShell();

  if (isQuestionNode(id)) {
    const note = document.createElement("div"); note.className = "cp-note";
    note.textContent = "Questions don't hold scores — see its edges.";
    pop.appendChild(note);
    document.getElementById("structPane").appendChild(pop);
    positionPopupAtNode(pop, id, rect);
    return;
  }

  const claimed = scoreClaimFor(id);
  cpLabel(pop, claimed.label);
  const claim = document.createElement("div"); claim.className = "cp-claim";
  claim.setAttribute("style", pillStyle(node.scores, "rb", 2));
  claim.textContent = claimed.text;
  pop.appendChild(claim);

  pop.appendChild(scoreSection(node.scores, "Per-scorer scores"));

  // pros and cons are chained off causal edges, which only a concept has
  if (node.kind === "concept") {
    const sec = document.createElement("div"); sec.className = "cp-section";
    cpLabel(sec, "Calculated arguments (from causal edges)");
    const { pros, cons } = calcArguments(id);
    if (!pros.length && !cons.length) {
      const note = document.createElement("div"); note.className = "cp-note";
      note.textContent = "No outgoing causal edges here, so this concept's score has no calculated arguments — its neighbours argue about their own scores instead.";
      sec.appendChild(note);
    } else {
      const grid = document.createElement("div"); grid.className = "cp-args";
      grid.appendChild(argColumn("pro", "Pros ↑", pros));
      grid.appendChild(argColumn("con", "Cons ↓", cons));
      sec.appendChild(grid);
    }
    pop.appendChild(sec);
  }

  document.getElementById("structPane").appendChild(pop);
  positionPopupAtNode(pop, id, rect);
}

function showClaimPopupForEdge(edgeId){
  hideClaimPopup();
  const edge = EDGES[edgeId];
  if (!edge) return;
  const to = referentOf(edge.to);
  const from = edge.from;
  const flip = (edge.relation === "reduces" || edge.relation === "impedes");
  const eff = effectScores(edge.relation, edge.scores);
  const pop = makePopupShell();

  cpLabel(pop, "Implied claim behind this edge's weight");
  const claim = document.createElement("div"); claim.className = "cp-claim";
  claim.setAttribute("style", pillStyle(eff, "rb", 2));
  // v4: bold the relation (edge) word
  claim.appendChild(document.createTextNode(`“${labelOf(from)} `));
  const relationBold = document.createElement("b"); relationBold.textContent = edge.relation; claim.appendChild(relationBold);
  claim.appendChild(document.createTextNode(` ${labelOf(to)}”`));
  pop.appendChild(claim);

  // effect framing: scores flipped for reduces/impedes so they read as effect-on-target
  pop.appendChild(scoreSection(eff, "Per-scorer effect on the target"));

  const note = document.createElement("div"); note.className = "cp-note";
  note.textContent = `Shown as each scorer's effect on “${labelOf(to)}”: “${edge.relation}” is ${flip ? "a decrease (red)" : "an increase (blue)"}. Split colors = scorers disagree.`;
  pop.appendChild(note);

  document.getElementById("structPane").appendChild(pop);
  positionPopupAtNode(pop, edge.id);
}

/* ============================================================
   FOCUS MODE — fade unrelated, emphasise the selection's neighbours
   ============================================================ */
let focusState = null; // the id of the focused node or edge, which are both boxes

/* What stays lit around a box. An edge box lights its two endpoints; a node lights every edge
   box on it and whatever is on the other side. */
function relatedSet(id){
  const set = new Set([id]);
  VISIBLE_EDGES.forEach(edge => {
    const target = referentOf(edge.to);
    if (edge.id === id) { set.add(edge.from); set.add(target); }
    if (edge.from === id) { set.add(edge.id); set.add(target); }
    if (target === id) { set.add(edge.id); set.add(edge.from); }
  });
  return set;
}

function incidentEdgeIds(id){
  if (EDGES[id]) return new Set([id]);
  return new Set(
    VISIBLE_EDGES.filter(e => e.from === id || referentOf(e.to) === id).map(e => e.id),
  );
}

function applyFocus(){
  const diagram = document.getElementById("diagram");
  // the minimap marks the selection too, so the two panes point at each other
  document.querySelectorAll(".sb-seg").forEach(el => el.classList.toggle("hl", el.dataset.node === focusState));
  if (!focusState) { diagram.classList.remove("focus-mode"); return; }
  diagram.classList.add("focus-mode");

  const related = relatedSet(focusState);
  const incident = incidentEdgeIds(focusState);
  // an edge selection highlights its own line; a node selection only marks the lines around it
  const picked = Boolean(EDGES[focusState]);

  document.querySelectorAll(".diag-node").forEach(el => {
    el.classList.toggle("hl", el.dataset.node === focusState);
    el.classList.toggle("faded", !related.has(el.dataset.node));
  });
  document.querySelectorAll(".edge-label").forEach(el => {
    el.classList.toggle("hl", el.dataset.edge === focusState);
    el.classList.toggle("faded", !related.has(el.dataset.edge));
  });
  document.querySelectorAll("#diagramViewport path.edge").forEach(path => {
    const on = incident.has(path.dataset.edge);
    path.classList.toggle("hl", on && picked);
    path.classList.toggle("incident", on && !picked);
    path.classList.toggle("faded", !on);
    if (path.dataset.half !== "out") return;
    const marker = !on ? "arrow" : (picked ? "arrowHl" : "arrowFocus");
    path.setAttribute("marker-end", `url(#${marker})`);
  });
}

/* ============================================================
   RENDER: COLOR KEY
   ============================================================ */
/* The bottom row demonstrates the active mode on scores of its own: a wide split for
   disagreement, and a same-sign pair for average, since any pair straddling zero averages
   to the gray that the row above already claims for "no change". */
function renderLegend(){
  const disagreement = borderMode === "disagreement";
  document.querySelectorAll("#legendModes .legend-mode")
    .forEach(b => b.classList.toggle("active", b.dataset.mode === borderMode));
  document.getElementById("legendSweep")
    .setAttribute("style", pillStyle(disagreement ? [-8, 8] : [4, 8], "rb", 2));
  document.getElementById("legendSweepText").textContent =
    disagreement ? "Split colors = scorers disagree" : "One color = scorers averaged";
}

/* Every colored element takes its border from pillStyle, so switching mode means re-running
   the renders. The claim popup is dropped rather than re-rendered - it reopens from whatever
   it was describing. */
function rerenderForBorderMode(){
  clearHighlight();
  renderQuestions();
  renderHottest();
  renderLegend();
  // repainted even while a question view hides it, or its nodes would still be in the old mode on
  // the way back
  restyleDiagram();
  const q = selectedQuestion ? QUESTIONS.find(x => x.id === selectedQuestion) : null;
  if (q) { renderQuestionView(q); renderSummaryForQuestion(q); }
  else { renderSummary(); }
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
let lastHighlighted = null;

function onNodeActivate(id){
  if (lastHighlighted === id) { toast(`Details view for “${NODES[id].label}” isn't designed yet.`); return; }
  highlightNode(id);
}

function clearHighlight(){
  focusState = null;
  document.querySelectorAll(".diag-node").forEach(el => el.classList.remove("hl", "faded"));
  document.querySelectorAll("#diagramViewport path.edge").forEach(p => {
    p.classList.remove("hl", "incident", "faded");
    if (p.dataset.half === "out") p.setAttribute("marker-end", "url(#arrow)");
  });
  document.querySelectorAll(".edge-label").forEach(l => l.classList.remove("hl", "faded"));
  document.querySelectorAll(".sb-seg").forEach(s => s.classList.remove("hl"));
  document.getElementById("diagram").classList.remove("focus-mode");
  hideClaimPopup();
  lastHighlighted = null;
}

function highlightNode(id){
  if (selectedQuestion) toggleQuestion(selectedQuestion); // return to default diagram
  if (!isVisible(id)) { missingFromDiagram(NODES[id].label, id); return; }
  focusState = id;
  applyFocus();
  showClaimPopupForNode(id);
  lastHighlighted = id;
  ensurePopupVisible(document.getElementById("claimPop"));
}

function onEdgeActivate(edgeId){
  if (selectedQuestion) toggleQuestion(selectedQuestion);
  const edge = EDGES[edgeId];
  if (!isVisible(edgeId)) {
    missingFromDiagram(`${NODES[edge.from].label} ${edge.relation} …`, edgeId);
    return;
  }
  focusState = edgeId;
  applyFocus();
  showClaimPopupForEdge(edgeId);
  lastHighlighted = null;
  ensurePopupVisible(document.getElementById("claimPop"));
}

/* Most of what the agenda lists isn't drawn under the default filters, so the toast names the
   checkbox that would show it. */
function missingFromDiagram(label, id){
  clearHighlight();
  lastHighlighted = id;
  const box = filterCausal && !isCausalKind(id) ? "Only cause & effect" : "Top 10 hottest";
  toast(`“${label}” isn't shown — uncheck “${box}” to see it.`);
}

function isCausalKind(id){ return Boolean(EDGES[id]) || isCausalNode(id); }

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============================================================
   DRAG-RESIZABLE SPLIT PANE
   ============================================================ */
function initDivider(){
  const panes = document.getElementById("panes");
  const agenda = document.querySelector(".agenda");
  const divider = document.getElementById("divider");
  let dragging = false;

  divider.addEventListener("pointerdown", (e) => {
    dragging = true;
    divider.classList.add("dragging");
    divider.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  divider.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const rect = panes.getBoundingClientRect();
    const min = 280, max = rect.width - 360 - 6; // keep structure >= 360px
    let w = Math.max(min, Math.min(max, e.clientX - rect.left));
    agenda.style.width = w + "px";
  });
  const stop = () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
  };
  divider.addEventListener("pointerup", stop);
  divider.addEventListener("pointercancel", stop);
}

/* ============================================================
   WIRING
   ============================================================ */
function init(){
  renderTopic();
  renderQuestions();
  renderFilters();
  renderHottest();
  renderSummary();
  renderLegend();
  // last: the summary strip's height is what's left over for the diagram, and the initial
  // fit has to measure the pane at the size it ends up
  renderDiagram();
  initDiagramPointer();
  initDivider();

  document.querySelectorAll("#legendModes .legend-mode").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.mode === borderMode) return;
      borderMode = b.dataset.mode;
      rerenderForBorderMode();
    });
  });
  document.getElementById("legendToggle").addEventListener("click", (e) => {
    e.stopPropagation();
    const lg = document.getElementById("legend");
    lg.classList.toggle("collapsed");
    document.getElementById("legendToggle").innerHTML =
      "Color key " + (lg.classList.contains("collapsed") ? "▸" : "▾");
  });

  document.getElementById("hotMore").addEventListener("click", () => { hotExpanded = !hotExpanded; renderHottest(); });

  // the shown tab and the collapse state are one state: re-clicking the tab that's showing hides it
  document.querySelectorAll("#summaryTabs .summary-tab").forEach(b => {
    b.addEventListener("click", () => {
      // read the active class rather than summaryMode: a selected question forces the Summary
      // tab active without changing the mode, and what's marked active is what the user sees
      if (b.classList.contains("active") && !isSummaryCollapsed()) { setSummaryCollapsed(true); return; }
      summaryMode = b.dataset.mode;
      if (selectedQuestion) showDefaultView();
      renderSummary();
      setSummaryCollapsed(false);
    });
  });
  // anywhere else on the row - the chevron included - toggles, the way the Color key's title does
  document.getElementById("summaryTabs").addEventListener("click", (e) => {
    if (e.target.closest(".summary-tab")) return;
    setSummaryCollapsed(!isSummaryCollapsed());
  });

  document.querySelectorAll("[data-stub]").forEach(el => el.addEventListener("click", () => toast(el.dataset.stub)));

  // Clear the highlight when clicking truly blank space (not a highlight source or popup).
  document.addEventListener("click", (e) => {
    // a pan that ends on blank canvas still fires a click there, and it must not drop the selection
    if (pannedSinceDown) { pannedSinceDown = false; return; }
    if (e.target.closest(".diag-node, .edge-label, .pill, .edge-phrase, .ref, .sb-seg, .claim-pop, .legend, .mini-node, .zoom-controls, .diagram-filters")) return;
    clearHighlight();
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
